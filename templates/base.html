<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}Tablero de Canales{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0d1017;
    color: #d1d4dc;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  a { color: inherit; }
  header.topbar {
    padding: 12px 24px;
    border-bottom: 1px solid #2a2e39;
    background: #131722;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header.topbar h1 { font-size: 15px; margin: 0; color: #d9a441; font-weight: 700; }
  header.topbar nav { display: flex; gap: 10px; margin-left: 16px; }
  header.topbar nav a {
    text-decoration: none;
    color: #848e9c;
    font-size: 12.5px;
    border: 1px solid #363c4e;
    border-radius: 6px;
    padding: 5px 10px;
  }
  header.topbar nav a:hover, header.topbar nav a.activo { border-color: #2962ff; color: #2962ff; }
  header.topbar .usuario { margin-left: auto; font-size: 12.5px; color: #848e9c; display: flex; align-items: center; gap: 10px; }
  header.topbar .usuario a { color: #ff5252; text-decoration: none; }
  .msg { padding: 8px 24px; font-size: 12.5px; background: #1e222d; color: #d9a441; }
  main { padding: 20px 24px 60px; }

  .card {
    background: #131722;
    border: 1px solid #2a2e39;
    border-radius: 10px;
    padding: 20px;
    max-width: 380px;
    margin: 60px auto;
  }
  .card h2 { color: #d9a441; font-size: 16px; margin-top: 0; }
  .card form p { margin: 10px 0; }
  .card label { display: block; font-size: 12.5px; color: #848e9c; margin-bottom: 4px; }
  .card input {
    width: 100%;
    background: #1a1e29;
    border: 1px solid #363c4e;
    border-radius: 6px;
    color: #d1d4dc;
    font-size: 13px;
    padding: 8px 10px;
  }
  .card button, .btn-primario {
    background: #2962ff;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 18px;
    cursor: pointer;
    margin-top: 8px;
  }
  .card button:hover, .btn-primario:hover { background: #1e4fd6; }
  .card .link-secundario { text-align: center; margin-top: 14px; font-size: 12.5px; }
  .card ul.errorlist { color: #ff5252; font-size: 12px; padding-left: 18px; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<header class="topbar">
  <h1>📊 Tablero de Canales</h1>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'dashboard:home' %}" class="{% block nav_dashboard %}{% endblock %}">Tablero</a>
    <a href="{% url 'chartview:grafico' %}" class="{% block nav_chart %}{% endblock %}">Gráfico</a>
  </nav>
  <div class="usuario">
    <span>👤 {{ user.username }}</span>
    <a href="{% url 'accounts:logout' %}">Salir</a>
  </div>
  {% endif %}
</header>

{% if messages %}
  {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
{% endif %}

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
