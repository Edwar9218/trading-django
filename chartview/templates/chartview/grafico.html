{% extends "base.html" %}
{% load static %}
{% block title %}Gráfico{% endblock %}
{% block nav_chart %}activo{% endblock %}

{% block extra_head %}
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="{% static 'chartview/fractal_sr.js' %}"></script>
<script src="{% static 'chartview/secuencia_fractal.js' %}"></script>
<style>
  /* Layout propio de esta página: base.html usa scroll normal (bien
     para el tablero), pero el gráfico necesita ocupar toda la altura
     disponible sin scroll de página, con #global-bar y #panels-row
     repartiéndose el espacio por flexbox — igual que el proyecto
     original, solo que ahora "main" hace el rol del <body> de antes. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header.topbar { flex-shrink: 0; }
  main {
    padding: 0 !important;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #131722;
      color: #d1d4dc;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Barra superior GLOBAL (fecha compartida + split + servidor) ── */
    #global-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: #12151c;
      border-bottom: 1px solid #2a2e39;
      flex-shrink: 0;
      flex-wrap: wrap;
      font-size: 12px;
    }
    #global-bar label { color: #848e9c; }
    #fecha-global {
      background: #2a2e39;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #d1d4dc;
      font-size: 13px;
      padding: 5px 9px;
      outline: none;
      min-width: 190px;
    }
    #fecha-global:focus { border-color: #2962ff; }
    #selector-fecha-hora { display: flex; align-items: center; gap: 4px; }
    #selector-fecha-hora input, #selector-fecha-hora select {
      background: #2a2e39;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #d1d4dc;
      font-size: 13px;
      padding: 5px 7px;
      outline: none;
      color-scheme: dark;
    }
    #selector-fecha-hora input:focus, #selector-fecha-hora select:focus { border-color: #2962ff; }
    #selector-fecha-hora .dos-puntos { color: #848e9c; }

    #modo-grafico-toggle {
      display: flex;
      gap: 2px;
      background: #2a2e39;
      border: 1px solid #363c4e;
      border-radius: 6px;
      padding: 2px;
    }
    .modo-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      color: #848e9c;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .modo-btn:hover { color: #d1d4dc; }
    .modo-btn.activo {
      background: #2962ff;
      color: #fff;
    }
    #controles-backtesting {
      display: none;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    #controles-backtesting.visible { display: flex; }

    #btn-split {
      background: transparent;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #d1d4dc;
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all .15s;
    }
    #btn-split:hover { border-color: #2962ff; color: #2962ff; }

    #sync-controls { display: flex; align-items: center; gap: 4px; }
    .sync-btn, #sync-modo {
      background: transparent; border: 1px solid #363c4e; border-radius: 6px;
      color: #848e9c; font-size: 12px; padding: 5px 10px; cursor: pointer;
    }
    #sync-modo { padding: 4px 6px; background: #1e222d; }
    .sync-btn:hover { color: #d1d4dc; }
    .sync-btn.activo { border-color: #2962ff; color: #2962ff; }

    #btn-multitf {
      background: transparent;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #d1d4dc;
      font-size: 12px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    #btn-multitf:hover { border-color: #d9a441; color: #d9a441; }

    /* Casilla "Ver lo posterior" (Backtesting) */
    #lbl-futuro {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: #b2b5be; cursor: pointer; user-select: none;
      padding-left: 8px; border-left: 1px solid #2a2e39;
    }
    #lbl-futuro input { accent-color: #2962ff; cursor: pointer; margin: 0; }

    /* ── Reproductor de backtesting (play/pause, paso a paso, velocidad) ── */
    #reproductor {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 4px;
      border-left: 1px solid #2a2e39;
      margin-left: 4px;
    }
    #reproductor button {
      background: transparent;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #d1d4dc;
      font-size: 13px;
      width: 30px;
      height: 28px;
      cursor: pointer;
      transition: all .15s;
    }
    #reproductor button:hover { border-color: #2962ff; color: #2962ff; }
    #reproductor button:disabled { opacity: 0.35; cursor: not-allowed; border-color: #363c4e; color: #848e9c; }
    #btn-play-pause.reproduciendo { background: #2962ff; border-color: #2962ff; color: #fff; }
    #velocidad-reproductor {
      background: #2a2e39;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #d1d4dc;
      font-size: 12px;
      padding: 5px 6px;
      outline: none;
      cursor: pointer;
    }

    #server-status {
      margin-left: auto;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #848e9c;
    }
    #server-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #363c4e;
    }
    #server-dot.online  { background: #26a69a; }
    #server-dot.offline { background: #ef5350; }

    /* ── Fila de paneles ─────────────────────────────── */
    #panels-row {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel + .panel {
      border-left: 1px solid #2a2e39;
    }

    /* ── Barra de controles de cada panel ─────────────── */
    .panel-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .panel-topbar label { font-size: 12px; color: #848e9c; }

    .symbol-input, .timeframe-select {
      background: #2a2e39;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #d1d4dc;
      font-size: 13px;
      padding: 6px 9px;
      outline: none;
      cursor: pointer;
    }
    .symbol-input { cursor: text; text-transform: uppercase; width: 118px; padding-right: 24px; }
    /* Oculta la flechita nativa que Edge/Chrome le agregan a los inputs
       con "list" (datalist) — se solapaba con nuestro botón "✕" y tapaba
       la última letra de la divisa escrita. */
    .symbol-input::-webkit-list-button,
    .symbol-input::-webkit-calendar-picker-indicator {
      display: none !important;
    }

    .symbol-input-wrap { position: relative; display: inline-flex; align-items: center; }
    .btn-clear-symbol {
      position: absolute;
      right: 5px;
      background: none;
      border: none;
      color: #565a68;
      font-size: 12px;
      line-height: 1;
      padding: 2px;
      cursor: pointer;
      display: none;   /* solo aparece cuando el input tiene texto */
    }
    .btn-clear-symbol:hover { color: #ef5350; }
    .symbol-input:focus, .timeframe-select:focus { border-color: #2962ff; }

    .btn-cargar {
      background: #2962ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-cargar:hover  { background: #1a48cc; }
    .btn-cargar:active { background: #1035a0; }

    .info-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .info-symbol { font-size: 14px; font-weight: 700; color: #fff; }
    .info-fecha  { color: #848e9c; }

    .btn-cargar-mas {
      background: transparent;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #848e9c;
      font-size: 11px;
      padding: 3px 9px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-cargar-mas:hover:not(:disabled) { border-color: #2962ff; color: #2962ff; }
    .btn-cargar-mas:disabled { opacity: .5; cursor: default; }

    .estado { font-size: 12px; }
    .estado-ok      { color: #26a69a; }
    .estado-error   { color: #ef5350; }
    .estado-cargando{ color: #f7931a; }

    .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid #363c4e;
      border-top-color: #2962ff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Aviso de carga sobre el gráfico: el spinner de la barra pasa desapercibido
       y, al cambiar de fecha, el gráfico entero se rehace sin explicación. */
    .carga-velo {
      position: absolute; inset: 0; z-index: 9;
      display: none; align-items: center; justify-content: center;
      background: rgba(19, 23, 34, .55);
      pointer-events: none;
    }
    .carga-velo.show { display: flex; }
    .carga-velo .carga-caja {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-radius: 8px;
      background: rgba(30, 34, 45, .96); border: 1px solid #2a2e39;
      color: #d1d4dc; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.45);
    }
    .carga-velo .carga-rueda {
      width: 18px; height: 18px; flex: none;
      border: 2.5px solid #363c4e; border-top-color: #2962ff;
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    .carga-velo small { display: block; color: #848e9c; font-size: 10.5px; margin-top: 1px; }

    /* ── Barra de señal ──────────────────────────────── */
    .signal-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 14px;
      background: #171b26;
      border-bottom: 1px solid #2a2e39;
      font-size: 11px;
      color: #848e9c;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .signal-bar .chip {
      padding: 2px 9px;
      border-radius: 10px;
      background: #2a2e39;
      color: #d1d4dc;
      font-weight: 600;
    }
    .chip-buy  { background: rgba(38,166,154,.18); color: #26a69a; }
    .chip-sell { background: rgba(239,83,80,.18);  color: #ef5350; }
    .chip-wait { background: #2a2e39; color: #848e9c; }

    .channel-toggles {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
      padding-left: 12px;
      border-left: 1px solid #2a2e39;
    }
    .channel-toggles label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      color: #d1d4dc;
      font-size: 11px;
    }
    .channel-toggles input[type="checkbox"] {
      accent-color: #2962ff;
      cursor: pointer;
      width: 12px; height: 12px;
    }

    /* ── Apagar/encender todos los indicadores de un golpe ── */
    .btn-todos {
      background: #1e222d;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #848e9c;
      font-family: inherit;
      font-size: 10.5px;
      padding: 3px 9px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-todos:hover { border-color: #2962ff; color: #d1d4dc; }
    .btn-todos.apagar:hover { border-color: #ef5350; color: #ef5350; }

    /* ── Leyenda de canales (reemplaza las tarjetas flotantes que antes
       aparecían pegadas al final de cada línea, adentro del gráfico) ── */
    .sig-text-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .channel-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-left: 12px;
      border-left: 1px solid #2a2e39;
    }
    .channel-legend .leg-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #d1d4dc;
      white-space: nowrap;
    }
    .channel-legend .leg-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Botón para colapsar/expandir la info (señal/kalman/canales/fechas) ── */
    .btn-toggle-info {
      background: transparent;
      border: 1px solid #363c4e;
      border-radius: 6px;
      color: #848e9c;
      font-size: 13px;
      padding: 5px 9px;
      cursor: pointer;
      margin-left: auto;
      line-height: 1;
      transition: all .15s;
    }
    .btn-toggle-info:hover { border-color: #2962ff; color: #2962ff; }

    /* ── Contenedores gráfico ─────────────────────────── */
    .charts-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .chart-container {
      flex: 1;
      position: relative;
      background: #131722;
      min-height: 0;
    }
    .overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* ── Tablero de posición del precio (toggle): panel fijo estilo
       TradingView, arriba a la derecha del gráfico. ── */
    .posicion-board {
      position: absolute;
      top: 10px; right: 10px;
      z-index: 7;
      display: none;
      flex-direction: column;
      background: rgba(19, 23, 34, 0.94);
      border: 1px solid #2a2e39;
      border-radius: 6px;
      overflow: hidden;
      min-width: 260px;
      max-width: 340px;
      font-size: 11px;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .posicion-board.show { display: flex; }
    .posicion-board .pb-title {
      padding: 6px 10px;
      background: #1e222d;
      color: #d9a441;
      font-weight: 600;
      letter-spacing: .04em;
      font-size: 10px;
      border-bottom: 1px solid #2a2e39;
    }
    .posicion-board .pb-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 7px 10px;
      border-bottom: 1px solid #1e222d;
    }
    .posicion-board .pb-row:last-child { border-bottom: none; }
    .posicion-board .pb-row-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .posicion-board .pb-label { color: #d1d4dc; font-weight: 500; }
    .posicion-board .pb-dir {
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      white-space: nowrap;
    }
    .posicion-board .pb-posicion { color: #d1d4dc; font-size: 10.5px; line-height: 1.3; }
    .posicion-board .pb-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: #d1d4dc;
    }
    .posicion-board .pb-metric { display: flex; align-items: center; gap: 5px; }
    .posicion-board .pb-vigencia {
      align-self: flex-start;
      font-size: 9.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 8px;
    }
    .posicion-board .pb-empty { padding: 10px; color: #848e9c; text-align: center; }

    /* ── Tabla de zonas S/R Fractal (lado izquierdo del gráfico) ── */
    .srf-board {
      position: absolute;
      top: 10px; left: 54px;
      z-index: 7;
      display: none;
      flex-direction: column;
      width: 400px;
      max-height: calc(100% - 50px);
      background: rgba(19, 23, 34, 0.95);
      border: 1px solid #2a2e39;
      border-radius: 6px;
      font-size: 11px;
      color: #d1d4dc;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .srf-board.show { display: flex; }
    .srf-board .srf-head {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px 6px 10px;
      background: #1e222d; border-bottom: 1px solid #2a2e39;
      color: #d9a441; font-weight: 600; font-size: 10px; letter-spacing: .04em;
    }
    .srf-board .srf-head .srf-sub { color: #848e9c; font-weight: 400; letter-spacing: 0; flex: 1; }
    .srf-board .srf-btn {
      background: none; border: 1px solid #363a45; color: #d1d4dc; border-radius: 4px;
      width: 20px; height: 18px; line-height: 14px; font-size: 11px; cursor: pointer; padding: 0;
    }
    .srf-board .srf-btn:hover { border-color: #2962ff; color: #fff; }
    .srf-board .srf-body { overflow-y: auto; }
    .srf-board.min .srf-body, .srf-board.min .srf-guia { display: none; }
    .srf-board table { width: 100%; border-collapse: collapse; }
    .srf-board th {
      position: sticky; top: 0; background: #181c27; color: #848e9c;
      font-weight: 500; font-size: 9.5px; text-align: left; padding: 4px 6px;
      border-bottom: 1px solid #2a2e39; white-space: nowrap;
    }
    .srf-board td { padding: 5px 6px 1px; vertical-align: top; white-space: nowrap; }
    .srf-board tr.srf-zona { cursor: pointer; }
    .srf-board tr.srf-zona:hover td, .srf-board tr.srf-zona.activa td { background: rgba(41, 98, 255, 0.10); }
    .srf-board td { border-bottom: 1px solid #1e222d; padding: 6px 6px; vertical-align: middle; }
    .srf-board .srf-n { color: #5d606b; font-size: 9px; margin-left: 3px; }
    .srf-board .srf-lect { white-space: normal; line-height: 1.25; }
    .srf-board .srf-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
    .srf-board .srf-tags { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 3px; }
    .srf-board .srf-tags span { font-size: 9px; color: #b2b5be; background: #2a2e39; border-radius: 6px; padding: 0 5px; }
    .srf-board .srf-tag { font-weight: 700; padding: 1px 6px; border-radius: 8px; font-size: 10px; }
    .srf-board .srf-bar { display: inline-block; width: 34px; height: 5px; background: #2a2e39; border-radius: 3px; vertical-align: middle; margin-right: 4px; }
    .srf-board .srf-bar i { display: block; height: 100%; border-radius: 3px; }
    .srf-board .srf-precio td {
      text-align: center; color: #ffb300; font-size: 10px; padding: 3px; border-bottom: 1px solid #1e222d;
      background: rgba(255, 179, 0, 0.06);
    }
    .srf-board .srf-guia {
      display: none; padding: 8px 10px; border-top: 1px solid #2a2e39; background: #161a25;
      font-size: 10.5px; line-height: 1.45; color: #b2b5be; overflow-y: auto; max-height: 45%;
    }
    .srf-board .srf-guia.show { display: block; }
    .srf-board .srf-guia b { color: #d1d4dc; }
    .srf-board .srf-empty { padding: 10px; color: #848e9c; text-align: center; }

    /* ── Panel de secuencia estructural (lado derecho del gráfico) ── */
    .seq-panel {
      position: absolute;
      top: 10px; right: 78px;
      z-index: 7;
      display: none;
      flex-direction: column;
      width: 232px;
      background: rgba(19, 23, 34, 0.95);
      border: 1px solid #2a2e39;
      border-radius: 6px;
      font-size: 11px;
      color: #d1d4dc;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .seq-panel.show { display: flex; }
    .seq-panel .seq-head {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px 6px 10px;
      background: #1e222d; border-bottom: 1px solid #2a2e39;
      color: #d9a441; font-weight: 600; font-size: 10px; letter-spacing: .04em;
    }
    .seq-panel .seq-head .seq-sub { color: #848e9c; font-weight: 400; letter-spacing: 0; flex: 1; }
    .seq-panel .seq-btn {
      background: none; border: 1px solid #363a45; color: #d1d4dc; border-radius: 4px;
      width: 20px; height: 18px; line-height: 14px; font-size: 11px; cursor: pointer; padding: 0;
    }
    .seq-panel .seq-btn:hover { border-color: #2962ff; color: #fff; }
    .seq-panel .seq-btn.on { border-color: #2962ff; color: #2962ff; }
    .seq-panel.min .seq-body, .seq-panel.min .seq-capas, .seq-panel.min .seq-guia { display: none; }
    .seq-panel .seq-body { padding: 8px 10px; }
    .seq-panel .seq-dir {
      display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
      font-weight: 700; font-size: 12px;
    }
    .seq-panel .seq-dir .seq-badge { padding: 1px 7px; border-radius: 8px; font-size: 10px; }
    .seq-panel .seq-paso {
      display: flex; align-items: center; gap: 6px; padding: 2px 0;
      border-bottom: 1px solid #1a1e29; line-height: 1.5;
    }
    .seq-panel .seq-paso:last-of-type { border-bottom: none; }
    .seq-panel .seq-paso .seq-ico { width: 13px; text-align: center; font-weight: 700; }
    .seq-panel .seq-paso .seq-nom { flex: 1; color: #b2b5be; }
    .seq-panel .seq-paso .seq-det { color: #5d606b; font-size: 9.5px; }
    .seq-panel .seq-paso.ok .seq-nom { color: #d1d4dc; }
    .seq-panel .seq-paso.ok .seq-ico { color: #26a69a; }
    .seq-panel .seq-paso.no .seq-ico { color: #4a4e5a; }
    .seq-panel .seq-paso.curso .seq-ico { color: #ffb300; }
    .seq-panel .seq-paso.curso .seq-nom { color: #ffb300; }
    .seq-panel .seq-score { margin-top: 8px; }
    .seq-panel .seq-score-top {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 10px; color: #848e9c; margin-bottom: 3px;
    }
    .seq-panel .seq-score-top b { font-size: 14px; color: #d1d4dc; }
    .seq-panel .seq-bar { height: 6px; background: #2a2e39; border-radius: 3px; overflow: hidden; }
    .seq-panel .seq-bar i { display: block; height: 100%; border-radius: 3px; transition: width .2s; }
    .seq-panel .seq-estado {
      margin-top: 7px; padding: 5px 7px; border-radius: 4px;
      font-size: 10px; line-height: 1.35; background: #161a25;
    }
    .seq-panel .seq-estado b { display: block; font-size: 10.5px; letter-spacing: .03em; }
    .seq-panel .seq-estado span { color: #848e9c; }
    .seq-panel .seq-stats {
      margin-top: 7px; padding-top: 6px; border-top: 1px solid #2a2e39;
      font-size: 9.5px; color: #848e9c; line-height: 1.5;
    }
    .seq-panel .seq-stats b { color: #b2b5be; }
    /* Un bloque compacto por sentido (alcista / bajista) */
    .seq-panel .seq-blq { padding: 6px 0 8px; border-bottom: 1px solid #1a1e29; }
    .seq-panel .seq-blq:first-child { padding-top: 0; }
    .seq-panel .seq-blq .seq-dir { margin-bottom: 4px; }
    .seq-panel .seq-blq .seq-dir .seq-nivel { flex: 1; color: #5d606b; font-weight: 400; font-size: 9.5px; }
    .seq-panel .seq-blq .seq-dir .seq-pts { font-size: 10px; color: #848e9c; font-weight: 400; }
    .seq-panel .seq-blq .seq-dir .seq-pts b { font-size: 13px; color: #d1d4dc; }
    .seq-panel .seq-vacio { color: #5d606b; font-weight: 400; font-size: 10px; }
    .seq-panel .seq-blq.seq-cerrada { opacity: .55; }
    .seq-panel .seq-puntos { display: inline-flex; gap: 4px; margin-left: 8px; align-items: center; }
    .seq-panel .seq-pt { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #5d606b; box-sizing: border-box; display: inline-block; }
    .seq-panel .seq-pt.ok { background: #d1d4dc; border-color: #d1d4dc; }
    .seq-panel .seq-pt.curso { border-color: #ffb300; background: rgba(255,179,0,.35); }
    .seq-panel .seq-frase { margin-top: 5px; font-size: 11.5px; font-weight: 600; }
    .seq-panel .seq-masfila { text-align: right; padding-top: 4px; }
    .seq-panel .seq-mas { background: none; border: 0; color: #5d606b; font-size: 10px; cursor: pointer; padding: 0; }
    .seq-panel .seq-mas:hover { color: #b2b5be; }
    .seq-panel .seq-capas {
      display: flex; flex-wrap: wrap; gap: 3px;
      padding: 6px 8px; border-top: 1px solid #2a2e39; background: #161a25;
    }
    .seq-panel .seq-capas button {
      background: #1e222d; border: 1px solid #2a2e39; color: #5d606b;
      border-radius: 8px; padding: 1px 7px; font-size: 9px; cursor: pointer;
    }
    .seq-panel .seq-capas button.on { color: #d1d4dc; border-color: #3d4250; background: #262b38; }
    .seq-panel .seq-empty { padding: 12px 10px; color: #848e9c; text-align: center; line-height: 1.4; }
    .seq-panel .seq-guia {
      display: none; padding: 8px 10px; border-top: 1px solid #2a2e39; background: #161a25;
      font-size: 10px; line-height: 1.45; color: #b2b5be;
    }
    .seq-panel .seq-guia.show { display: block; }
    .seq-panel .seq-guia b { color: #d1d4dc; }

    /* ── Barra lateral de dibujo (estilo TradingView) ─────────────── */
    .chart-plot {
      position: absolute;
      top: 0; left: 44px; right: 0; bottom: 0;
    }
    .draw-toolbar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 44px;
      background: #1e222d;
      border-right: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      gap: 2px;
      z-index: 6;
      user-select: none;
    }
    .draw-tool {
      width: 32px; height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #848e9c;
      cursor: pointer;
      transition: all .15s;
    }
    .draw-tool:hover { background: #2a2e39; color: #d1d4dc; }
    .draw-tool.active { background: #2962ff; color: #fff; }
    .draw-tool.danger:hover { background: rgba(239,83,80,.15); color: #ef5350; }
    .draw-tool svg { width: 18px; height: 18px; pointer-events: none; }
    .draw-sep { width: 24px; height: 1px; background: #2a2e39; margin: 6px 0; flex-shrink: 0; }
    .smf-container {
      height: 120px;
      position: relative;
      background: #131722;
      border-top: 1px solid #2a2e39;
      display: none;
      flex-shrink: 0;
    }

    .empty-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #363c4e;
      font-size: 13px;
      text-align: center;
      padding: 0 20px;
      pointer-events: none;
      z-index: 2;
    }
    .empty-screen svg { opacity: .25; }
  </style>
</style>

<style id="layout-compacto">
  /* ═══════════════════════════════════════════════════════════
     Layout compacto — prioridad al gráfico.
     Solo cambia la ORGANIZACIÓN visual; ningún indicador, control
     ni dato se elimina. Va al final para pisar los estilos de arriba.
     ═══════════════════════════════════════════════════════════ */
  header.topbar { padding-top: 5px; padding-bottom: 5px; }

  /* Barra global: más baja */
  #global-bar { padding: 4px 12px; gap: 8px; }
  #selector-fecha-hora input, #selector-fecha-hora select { padding: 3px 5px; font-size: 12px; }
  #hora-servidor-info { font-size: 11px; color: #848e9c; white-space: nowrap; }
  .modo-btn { padding: 3px 10px; }
  #btn-split, #btn-multitf, #btn-enfoque { padding: 3px 10px; }
  #reproductor button { width: 28px; height: 24px; }
  #velocidad-reproductor { padding: 3px 5px; }
  #btn-enfoque {
    background: transparent; border: 1px solid #363c4e; border-radius: 6px;
    color: #d1d4dc; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  #btn-enfoque:hover, body.menu-abierto #btn-enfoque { border-color: #2962ff; color: #2962ff; }
  /* Sin barra de navegación arriba (Tablero de Canales / Tablero / Gráfico /
     usuario) ni botón Multi-temporalidad: solo ocupaban espacio. El botón
     "⌂" es la única forma de volver a mostrar la barra si la necesitas. */
  header.topbar { display: none !important; }
  body.menu-abierto header.topbar { display: flex !important; }
  #btn-multitf { display: none !important; }   /* sigue en el DOM: el JS le asigna su enlace */

  /* Fila 1 de cada panel: Divisa · Timeframe · Cargar · Filtros · info — todo en UNA línea */
  .panel-topbar { flex-wrap: wrap; gap: 4px 8px; padding: 5px 10px; }
  .panel-topbar > * { flex-shrink: 0; }
  /* La info (☰) arranca oculta; al abrirla usa el espacio que sobre y, si no cabe, baja a su propia línea */
  .panel-topbar .info-bar { flex: 1 1 260px; min-width: 0; overflow: hidden; flex-wrap: nowrap; gap: 6px; }
  .panel-topbar .info-bar > * { flex-shrink: 0; white-space: nowrap; }
  .panel-topbar .info-bar .info-fecha { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .symbol-input, .timeframe-select { padding: 4px 8px; font-size: 12.5px; }
  .symbol-input { width: 112px; padding-right: 22px; }
  .btn-cargar { padding: 5px 13px; font-size: 12.5px; }
  .btn-toggle-info { margin-left: 0; padding: 4px 8px; }

  /* Botón Filtros (abre/cierra la fila de indicadores) */
  .btn-filtros {
    display: inline-flex; align-items: center; gap: 6px;
    background: #1e222d; border: 1px solid #363c4e; border-radius: 6px;
    color: #d1d4dc; font-size: 12px; padding: 4px 9px; cursor: pointer;
    transition: border-color .15s;
  }
  .btn-filtros:hover { border-color: #2962ff; }
  .btn-filtros .chev { transition: transform .15s; }
  .btn-filtros[aria-expanded="false"] .chev { transform: rotate(180deg); }
  .filtros-count {
    background: #2962ff; color: #fff; border-radius: 9px;
    font-size: 10px; font-weight: 600; padding: 0 6px; min-width: 16px; text-align: center;
  }
  .filtros-count:empty { display: none; }

  /* Fila 2: indicadores (colapsable) · Fila 3: señales + leyenda (finas) */
  .signal-bar { padding: 3px 10px; gap: 4px 10px; font-size: 10.5px; }
  .channel-toggles {
    order: -1; flex: 1 1 100%; margin-left: 0; padding: 2px 0 5px;
    border-left: 0; border-bottom: 1px solid #2a2e39;
    flex-wrap: wrap; gap: 4px 8px;
  }
  .panel.filtros-cerrados .channel-toggles { display: none; }
  .channel-toggles label {
    padding: 2px 8px; border: 1px solid #2a2e39; border-radius: 12px;
    background: #171b26; color: #a3a8b5; font-size: 11px; gap: 5px;
    transition: all .12s;
  }
  .channel-toggles label:hover { border-color: #363c4e; color: #d1d4dc; }
  .channel-toggles label:has(input:checked) {
    border-color: rgba(41, 98, 255, .6); background: rgba(41, 98, 255, .12); color: #e6e9f2;
  }
  .channel-toggles input[type="checkbox"] { width: 11px; height: 11px; }
  .sig-text-group { gap: 4px 10px; }
  .channel-legend { margin-left: auto; padding-left: 0; border-left: 0; }
  .panel.filtros-cerrados.info-oculta .signal-bar { display: none; }

  /* Con 1 pantalla, Divisa · Timeframe · Cargar · Filtros suben a la barra global
     (ocupan el hueco libre de la derecha); con 2 pantallas vuelven a cada panel. */
  #slot-controles { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
  #slot-controles:empty { display: none; }
  #slot-controles .panel-topbar {
    flex: 1 1 auto; min-width: 0; background: transparent; border-bottom: 0; padding: 0;
  }
  #slot-controles .panel-topbar .info-bar { flex: 1 1 200px; }

  /* Con 2 pantallas: menos texto y tableros flotantes más angostos */
  #panels-row.split .panel-topbar label { display: none; }
  #panels-row.split .srf-board { width: 340px; left: 48px; }
  #panels-row.split .posicion-board { min-width: 220px; max-width: 260px; }
  #panels-row.split .seq-panel { width: 205px; right: 70px; }
</style>
{% endblock %}

{% block content %}
<div id="global-bar">
  <div id="modo-grafico-toggle">
    <button id="btn-modo-online" class="modo-btn" type="button" title="Gráfico en vivo, siempre hasta la última vela — como funcionaba antes">🟢 Online</button>
    <button id="btn-modo-backtesting" class="modo-btn" type="button" title="Elegí una fecha/hora pasada y repasá el gráfico vela a vela">⏱ Backtesting</button>
  </div>
  <div id="controles-backtesting">
    <label for="fecha-dia" title="Es la hora del servidor de MT5: la misma que se ve en el eje del gráfico y en las velas, no la de tu computador.">📅 Hasta (hora MT5):</label>
    <!-- El valor real vive en #fecha-global ("AAAA-MM-DDTHH:MM", hora del servidor MT5), oculto:
         todo el código lo sigue leyendo/escribiendo igual. Los 3 controles visibles son solo la
         "cara": calendario para el día y hora/minuto en formato 24 h (sin a. m./p. m.). -->
    <input id="fecha-global" type="hidden" />
    <span id="selector-fecha-hora">
      <input id="fecha-dia" type="date" title="Día (calendario)" />
      <select id="fecha-hora" title="Hora (formato 24 h)"></select>
      <span class="dos-puntos">:</span>
      <select id="fecha-minuto" title="Minuto"></select>
    </span>
    <span id="hora-servidor-info" title="Hora del servidor de MT5"></span>
    <label id="lbl-futuro" title="Tras clic + Enter o buscar una fecha/hora, muestra a la derecha las velas posteriores sin indicadores">
      <input type="checkbox" id="chk-futuro" checked> Ver lo posterior
    </label>
    <div id="reproductor">
      <button id="btn-paso-atras" type="button" title="Retroceder 1 vela">⏮</button>
      <button id="btn-play-pause" type="button" title="Reproducir (avanza solo, vela a vela)">▶</button>
      <button id="btn-paso-adelante" type="button" title="Avanzar 1 vela">⏭</button>
      <select id="velocidad-reproductor" title="Velocidad de reproducción">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
    </div>
  </div>
  <button id="btn-split">⊞ 2 pantallas</button>
  <div id="sync-controls" style="display:none">
    <button type="button" id="sync-zoom" class="sync-btn activo" title="Zoom y desplazamiento: lo que hagas en un gráfico se replica en el otro">🔗 Zoom/Scroll</button>
    <button type="button" id="sync-cross" class="sync-btn activo" title="Crosshair sincronizado entre las 2 pantallas">✛ Crosshair</button>
    <select id="sync-modo" title="Cómo se alinean los gráficos: por fecha (sirve con distinta temporalidad) o por cantidad de velas desde la última">
      <option value="fecha" selected>Por fecha</option>
      <option value="barras">Por velas</option>
    </select>
    <button type="button" id="sync-alinear" class="sync-btn" title="Alinear la Pantalla 2 con la vista de la Pantalla 1 ahora mismo">⇥ Alinear</button>
  </div>
  <a id="btn-multitf" href="#" target="_blank" rel="noopener" title="Abre en una pestaña nueva: tablero S-P-N para varias divisas y temporalidades a la vez">📊 Multi-temporalidad</a>
  <button id="btn-enfoque" type="button" title="Mostrar/ocultar la barra de navegación (Tablero, Gráfico, usuario, Salir)">⌂</button>
  <div id="slot-controles"></div>
  <div id="server-status">
    <div id="server-dot"></div>
    <span id="server-label">Verificando servidor…</span>
  </div>
</div>

<div id="panels-row">
  <div class="panel" id="panel-1"></div>
  <div class="panel" id="panel-2" style="display:none"></div>
</div>

<template id="panel-template">
  <div class="panel-topbar">
    <label>Divisa:</label>
    <span class="symbol-input-wrap">
      <input class="symbol-input" list="" type="text" placeholder="EURUSD" maxlength="20" autocomplete="off" />
      <button type="button" class="btn-clear-symbol" tabindex="-1" title="Borrar">✕</button>
    </span>
    <datalist class="symbol-list">
      {% if mis_divisas %}
        {% for d in mis_divisas %}<option value="{{ d }}"></option>
        {% endfor %}
      {% else %}
        <option value="EURUSD"></option>
        <option value="GBPUSD"></option>
        <option value="USDJPY"></option>
        <option value="USDCHF"></option>
        <option value="USDCAD"></option>
        <option value="AUDUSD"></option>
        <option value="NZDUSD"></option>
        <option value="EURGBP"></option>
        <option value="EURJPY"></option>
        <option value="EURCHF"></option>
        <option value="EURAUD"></option>
        <option value="EURCAD"></option>
        <option value="GBPJPY"></option>
        <option value="GBPCHF"></option>
        <option value="GBPAUD"></option>
        <option value="AUDJPY"></option>
        <option value="AUDCAD"></option>
        <option value="AUDNZD"></option>
        <option value="CADJPY"></option>
        <option value="CHFJPY"></option>
        <option value="NZDJPY"></option>
        <option value="XAUUSD"></option>
        <option value="XAGUSD"></option>
        <option value="US30"></option>
        <option value="US500"></option>
        <option value="NAS100"></option>
        <option value="GER40"></option>
        <option value="UK100"></option>
        <option value="BTCUSD"></option>
        <option value="ETHUSD"></option>
      {% endif %}
    </datalist>

    <label>Timeframe:</label>
    <select class="timeframe-select">
      {% if mis_timeframes %}
        {% for tf in mis_timeframes %}<option value="{{ tf }}"{% if tf == "H4" %} selected{% endif %}>{{ tf }}</option>
        {% endfor %}
      {% else %}
        <option value="M15">M15</option>
        <option value="M30">M30</option>
        <option value="H1">H1</option>
        <option value="H2">H2</option>
        <option value="H3">H3</option>
        <option value="H4" selected>H4</option>
        <option value="H6">H6</option>
        <option value="H8">H8</option>
        <option value="H12">H12</option>
        <option value="D1">D1</option>
        <option value="W1">W1</option>
        <option value="MN1">MN1</option>
      {% endif %}
    </select>

    <button class="btn-cargar">▶ Cargar</button>
    <div class="spinner"></div>

    <button type="button" class="btn-filtros" aria-expanded="true" title="Mostrar/ocultar los indicadores y filtros de este gráfico">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
      <span>Filtros</span><span class="filtros-count"></span>
      <svg class="chev" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
    </button>

    <div class="info-bar">
      <button class="btn-cargar-mas" style="display:none">← Cargar más historial</button>
      <span class="estado"></span>
    </div>
  </div>

  <div class="signal-bar">
    <div class="sig-text-group">
      <span class="sig-signal chip chip-wait">Señal: —</span>
      <span class="sig-kalman">Kalman: —</span>
      <span class="sig-canales">Canales: —</span>
      <span class="sig-kn">KN: —</span>
      <span class="sig-srf"></span>
      <span class="sig-seq"></span>
    </div>

    <div class="channel-toggles">
      <button type="button" class="btn-todos">Apagar todo</button>
      <label class="lbl-largo"><input type="checkbox" class="chk-largo" {% if pref_largo %}checked{% endif %}> Largo</label>
      <label class="lbl-mediano"><input type="checkbox" class="chk-mediano" {% if pref_mediano %}checked{% endif %}> Mediano</label>
      <label class="lbl-corto"><input type="checkbox" class="chk-corto" {% if pref_corto %}checked{% endif %}> Corto</label>
      <label><input type="checkbox" class="chk-relleno" {% if pref_relleno %}checked{% endif %}> Relleno</label>
      <label><input type="checkbox" class="chk-kalman" {% if pref_kalman %}checked{% endif %}> Kalman</label>
      <label title="Cruce EMA5/EMA13 con TP1/TP2/TP3 y SL calculados por ATR(14) — portado del indicador KN Smart TP SL Signals de TradingView.">
        <input type="checkbox" class="chk-kn" {% if pref_kn_signals %}checked{% endif %}> KN TP/SL
      </label>
      <label title="Soportes/resistencias por pivotes confirmados, con ruptura, retest de rol invertido (R→S / S→R) e invalidación — portado del indicador Advanced Support and Resistance with Reversal de TradingView.">
        <input type="checkbox" class="chk-sr" {% if pref_sr_avanzado %}checked{% endif %}> S/R Avanzado
      </label>
      <label title="Zonas de soporte/resistencia donde se AGRUPAN fractales importantes. Cada fractal se puntúa por jerarquía de escalas (2→34 velas), prominencia en ATR y confirmación en temporalidades superiores (x3, x12). La etiqueta muestra la fuerza (0-100); la tabla de la izquierda explica cada zona. Sin repintado: cada fractal cuenta solo desde su vela de confirmación.">
        <input type="checkbox" class="chk-srf" {% if pref_sr_fractal %}checked{% endif %}> S/R Fractal
      </label>
      <label title="Secuencia estructural completa: FRACTAL → RUPTURA → DESPLAZAMIENTO → IMBALANCE (FVG) → RETESTEO → CONTINUACIÓN. No marca nada por tener solo un fractal: cada etapa habilita la siguiente y el panel de la derecha muestra el score 0-100 y el estado. Sin repintado: cada etapa aparece en la vela que la confirmó y no se mueve después.">
        <input type="checkbox" class="chk-seq" {% if pref_secuencia %}checked{% endif %}> Secuencia
      </label>
      <label title="Prueba varios pivot_len para cada canal y se queda con el de mejor calidad — más lento, pero no hace falta afinarlo a mano en config.py">
        <input type="checkbox" class="chk-auto-pivot" {% if pref_auto_pivot %}checked{% endif %}> Pivot auto
      </label>
      <label title="Para cada uno de los 4 canales (largo, largo inverso, corto, corto inverso), muestra dónde está el precio ahora: adentro, tocando un borde, rompiendo o ya rompió. Solo información vigente, sin arrastrar eventos viejos.">
        <input type="checkbox" class="chk-posicion-board" {% if pref_tablero_canales %}checked{% endif %}> Tablero canales
      </label>
    </div>

    <div class="channel-legend"></div>
  </div>

  <div class="charts-container">

<script>
// Endpoints Django (reemplaza al servidor Flask separado en localhost:5051 —

const API = {
  datos: "{% url 'chartview:api_datos' %}",
  horaServidor: "{% url 'chartview:api_hora_servidor' %}",
  vela_actual: "{% url 'chartview:api_vela_actual' %}",
  velas_extra: "{% url 'chartview:api_velas_extra' %}",

  dibujos_guardar: "{% url 'chartview:api_dibujos_guardar' %}",
  preferencia_guardar: "{% url 'chartview:api_preferencia_guardar' %}",
};

function getCookie(name) {
  const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}
const CSRF_TOKEN = getCookie('csrftoken');

// Guarda UN checkbox de la barra de canales apenas cambia (sin botón
// aparte) — así la próxima vez que se entra a /grafico/ quedan tal cual
// se dejaron, en vez de volver siempre a los valores por defecto.
function guardarPreferencia(campo, valor) {
  fetch(API.preferencia_guardar, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF_TOKEN },
    body: JSON.stringify({ campo, valor }),
  }).catch(() => { /* guardado en segundo plano, no bloquea la UI */ });
}

// Versión global de hexToRgba (crearPanel() define su propia copia interna
// para las funciones de dibujo del canvas; esta es la que usan los
// controles globales como el modal multi-temporalidad).
function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// ══════════════════════════════════════════════════════════
// Fábrica de paneles: cada pantalla (1 o 2) es una instancia

// checkboxes, etc. — pero TODAS comparten la misma fecha (arriba).
// ══════════════════════════════════════════════════════════
function crearPanel(rootEl, opciones = {}) {
  const tpl = document.getElementById("panel-template").content.cloneNode(true);
  rootEl.appendChild(tpl);

  const $ = sel => rootEl.querySelector(sel);

  const sigSignal        = $(".sig-signal");

  const sigCanales       = $(".sig-canales");
  const sigKn            = $(".sig-kn");
  const lblLargo         = $(".lbl-largo");

  const chkKn            = $(".chk-kn");
  const chkSr            = $(".chk-sr");
  const chkSrf           = $(".chk-srf");
  const sigSrf           = $(".sig-srf");
  const srfBoardEl       = $(".srf-board");
  const chkSeq           = $(".chk-seq");

  const chkPosicionBoard = $(".chk-posicion-board");

  const chartContainer   = $(".chart-container");
  const chartPlot        = $(".chart-plot");
  const emptyScreen      = $(".empty-screen");
  const overlayCanvas    = $(".overlay-canvas");
  const drawToolButtons  = rootEl.querySelectorAll(".draw-tool[data-tool]");
  const btnClearDrawings = rootEl.querySelector(".draw-tool[data-action='clear']");
  const smfContainer     = $(".smf-container");

  const sigTextGroup     = $(".sig-text-group");

  // Datalist necesita un id único por panel para poder referenciarlo con "list="
  const listId = "symbol-list-" + Math.random().toString(36).slice(2);
  symbolList.id = listId;
  symbolInput.setAttribute("list", listId);

  // ── Estado propio de este panel ──
  let chart, candleSerie, overlayCtx;
  let smfChart = null, smfHist = null, smfLine = null;
  let overlaySeries = [];      // líneas del Kalman
  let channelSeriesList = [];  // líneas de canal (base/par/mid)
  let knSeriesList = [];       // líneas del indicador KN (entry/SL/TP1-3)
  let srSeriesList = [];       // líneas del indicador S/R Avanzado (niveles + flips)
  let currentChannels = [];
  let currentKalman = null;
  let currentPivots = [];
  let currentKN = null;        // última señal KN calculada sobre las velas cargadas
  let currentSR = null;        // niveles S/R Avanzado calculados sobre las velas cargadas
  let currentSRF = null;       // zonas S/R Fractal (agrupación de fractales multiescala)
  let currentPosicionCanales = [];    // tablero: posición del precio respecto a cada canal
  // Estado inicial de estos toggles = lo que Django ya precargó en el
  // checkbox (preferencia guardada del usuario), no un valor fijo — así
  // el estado interno del panel arranca sincronizado con lo que se ve.
  let mostrarPosicionBoard = chkPosicionBoard.checked;
  let mostrarKalman = chkKalman.checked;
  let mostrarKN = chkKn.checked;
  let mostrarSR = chkSr.checked;
  let mostrarSRF = chkSrf.checked;
  let srfResaltada = null;     // zona resaltada al pasar el mouse por su fila de la tabla
  const leerLS = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v === "1"; } catch (e) { return d; } };
  const guardarLS = (k, v) => { try { localStorage.setItem(k, v ? "1" : "0"); } catch (e) {} };

  // ── Apagar/encender todos los indicadores de un golpe ──
  // No duplica la lógica de cada indicador: marca el checkbox y dispara
  // su propio evento "change", así corre exactamente el mismo código que
  // si lo hubieras clickeado a mano (dibujo, panel y guardado de
  // preferencia incluidos). Si mañana agregás un indicador nuevo, el
  // botón lo agarra solo, sin tocar nada acá.
  const togglesBar = $(".channel-toggles");
  const btnTodos = $(".btn-todos");

  // "Pivot auto" queda AFUERA a propósito: no es un indicador que se
  // dibuje, es un modo de cálculo del servidor que hace más lento el
  // próximo "Cargar". Encenderlo sin querer, de rebote, sería una
  // sorpresa desagradable. Los checkboxes ocultos (canales que esta
  // divisa no tiene) también se saltean: el botón actúa sobre lo que se
  // ve en la barra, nada más.
  function indicadoresDeLaBarra() {
    return [...togglesBar.querySelectorAll("input[type=checkbox]")].filter(c =>
      !c.classList.contains("chk-auto-pivot") &&
      c.closest("label") && c.closest("label").style.display !== "none");
  }

  const elBadgeFiltros = $(".filtros-count");   // referencia fija: el panel 1 cambia de lugar en el DOM
  function actualizarBtnTodos() {
    const lista = indicadoresDeLaBarra();
    const activos = lista.filter(c => c.checked).length;
    const apagar = activos > 0;
    btnTodos.textContent = apagar ? "Apagar todo" : "Encender todo";
    btnTodos.classList.toggle("apagar", apagar);
    if (elBadgeFiltros) elBadgeFiltros.textContent = activos ? String(activos) : "";
    btnTodos.title = apagar
      ? `Apaga de una vez los ${activos} indicadores encendidos (Pivot auto no se toca)`
      : `Enciende los ${lista.length} indicadores de la barra (Pivot auto no se toca)`;
  }

  btnTodos.addEventListener("click", () => {
    const lista = indicadoresDeLaBarra();
    // Si hay aunque sea uno encendido, el botón apaga. Recién con todos
    // apagados, enciende — así un click nunca hace las dos cosas a medias.
    const prender = !lista.some(c => c.checked);
    lista.forEach(c => {
      if (c.checked === prender) return;        // ya estaba como corresponde
      c.checked = prender;
      c.dispatchEvent(new Event("change", { bubbles: true }));
    });
    actualizarBtnTodos();
  });

  // Delegación en la barra entera: cualquier checkbox que cambie (a mano
  // o por el botón) refresca la etiqueta, sin engancharlo uno por uno.
  togglesBar.addEventListener("change", actualizarBtnTodos);
  actualizarBtnTodos();

  // ── Botón "Filtros": abre/cierra la fila de indicadores de TODOS los
  // paneles a la vez, y recuerda cómo la dejaste. Cerrada, el gráfico gana
  // esa altura (el ResizeObserver de cada panel re-encuadra solo).
  const btnFiltros = $(".btn-filtros");
  function aplicarEstadoFiltros(cerrados) {
    document.querySelectorAll(".panel").forEach(p => {
      p.classList.toggle("filtros-cerrados", cerrados);
      const b = p.querySelector(".btn-filtros");
      if (b) b.setAttribute("aria-expanded", String(!cerrados));
    });
    rootEl.classList.toggle("filtros-cerrados", cerrados);
    if (btnFiltros) btnFiltros.setAttribute("aria-expanded", String(!cerrados));
  }
  aplicarEstadoFiltros(leerLS("filtros_cerrados", false));
  if (btnFiltros) btnFiltros.addEventListener("click", () => {
    const cerrar = !rootEl.classList.contains("filtros-cerrados");
    guardarLS("filtros_cerrados", cerrar);
    aplicarEstadoFiltros(cerrar);
  });
  let srfTablaMin = leerLS("srf_tabla_min", false);
  let srfGuiaVisible = leerLS("srf_tabla_guia", false);

  // ── Secuencia estructural (fractal → ruptura → desplazamiento →
  // imbalance → retesteo → continuación). El motor vive en
  // chartview/static/chartview/secuencia_fractal.js.
  let currentSEQ = null;
  let mostrarSEQ = chkSeq.checked;
  let seqPanelMin = leerLS("seq_panel_min", false);
  let seqGuiaVisible = leerLS("seq_panel_guia", false);
  let seqMasVisible = leerLS("seq_panel_mas", false);
  // Cada elemento del gráfico se puede apagar por separado (punto 10 del
  // pliego): así se puede dejar solo las zonas, o solo las flechas.
  const seqCapas = {
    fractales: leerLS("seq_capa_fractales", true),
    ruptura:   leerLS("seq_capa_ruptura", true),
    imbalance: leerLS("seq_capa_imbalance", true),
    retest:    leerLS("seq_capa_retest", true),
    flechas:   leerLS("seq_capa_flechas", true),
    etiqueta:  leerLS("seq_capa_etiqueta", true),
  };
  // Alertas: solo para eventos CONFIRMADOS y solo una vez cada uno.
  const seqAlertas = {
    activas:  leerLS("seq_alerta_on", false),
    sonido:   leerLS("seq_alerta_sonido", false),
    fractal:  leerLS("seq_alerta_fractal", false),
    ruptura:  leerLS("seq_alerta_ruptura", true),
    imbalance:leerLS("seq_alerta_imbalance", true),
    retest:   leerLS("seq_alerta_retest", true),
    completo: leerLS("seq_alerta_completo", true),
  };
  let seqEventosVistos = new Set();   // ids ya alertados (no repetir)
  let seqUltimaBarra = null;          // última vela evaluada para alertas
  let lastRealTime = null;
  // Futuro crudo: `futuroSerie` dibuja las velas posteriores al corte;
  // `limiteDerecha` (tiempo de la última vela analizada) recorta las
  // proyecciones de los indicadores para que no invadan esa zona.
  let futuroSerie = null;
  let limiteDerecha = null;
  let cantidadFuturo = 0;
  let loadedCandles = [];
  let symbolActual = null, timeframeActual = null;
  let cargandoDatos = false, cargandoMas = false;
  let filtroCanales = { largo: chkLargo.checked, mediano: chkMediano.checked, corto: chkCorto.checked };
  let mostrarRelleno = chkRelleno.checked;

  // ── Barra de dibujo (estilo TradingView) ──
  const TOOL_COLORS = {
    trendline: "#2962ff",
    hline:     "#f7931a",
    fib:       "#ab47bc",
    brush:     "#26a69a",
    text:      "#eeeeee",
  };
  let activeTool = "cursor";   // cursor | trendline | hline | fib | brush | text
  let drawings   = [];         // dibujos ya finalizados de este panel
  let drawTemp   = null;       // dibujo nuevo en curso (mientras se arrastra el mouse)
  let hoverMatch = null;       // { drawing, handle } — dibujo/manija bajo el cursor (modo cursor)
  let dragState  = null;       // dibujo/manija que se está moviendo ahora mismo

  // Botón "✕" para borrar el contenido del campo. Va acá arriba (nivel de
  // crearPanel, no adentro de init()) porque cualquier lugar que toque
  // symbolInput.value "por código" (no tipeando) tiene que llamarla a
  // mano — el navegador NO dispara el evento "input" cuando el valor se
  // asigna desde JS, solo cuando el usuario escribe. setSymbol() (usado
  // desde afuera, en toggleSplit) también la necesita.
  function actualizarBtnClear() {
    btnClearSymbol.style.display = symbolInput.value ? "block" : "none";
  }

  function grupoDeCanal(label) {
    const l = (label || "").toLowerCase();
    if (l.includes("largo")) return "largo";
    if (l.includes("mediano")) return "mediano";
    if (l.includes("corto")) return "corto";
    return "otro";
  }

  function hexToRgba(hex, alpha) {
    const h = hex.replace("#", "");
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function setEstado(msg, tipo) {
    estadoEl.textContent = msg;
    estadoEl.className = "estado estado-" + tipo;
  }

  function resizeOverlayCanvas() {
    const dpr = window.devicePixelRatio || 1;
    overlayCanvas.style.width  = chartPlot.clientWidth + "px";
    overlayCanvas.style.height = chartPlot.clientHeight + "px";
    overlayCanvas.width  = Math.round(chartPlot.clientWidth * dpr);
    overlayCanvas.height = Math.round(chartPlot.clientHeight * dpr);
    overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ── Herramientas de dibujo: cursor/pan de coordenadas ──
  const xToTime  = x => chart.timeScale().coordinateToTime(x);
  const yToPrice = y => candleSerie.coordinateToPrice(y);
  const timeToX  = t => chart.timeScale().timeToCoordinate(t);
  const priceToY = p => candleSerie.priceToCoordinate(p);

  function updateToolbarUI() {
    drawToolButtons.forEach(b => b.classList.toggle("active", b.dataset.tool === activeTool));
  }

  function updateCanvasInteractivity() {
    // En modo cursor el canvas de dibujo NUNCA intercepta el mouse — así el
    // pan/zoom/crosshair nativo del gráfico sigue funcionando siempre. El
    // "agarrar" un dibujo existente para arrastrarlo se resuelve aparte, con
    // un listener en fase de captura sobre chartPlot (ver init()) que corta
    // el evento antes de que el gráfico nativo llegue a procesarlo — evita
    // el problema de que togglear pointer-events dinámicamente en el mismo
    // frame no siempre llega a tiempo para el hit-test del mousedown.
    if (activeTool === "cursor") {
      overlayCanvas.style.pointerEvents = "none";
      overlayCanvas.style.cursor = "default";
    } else {
      overlayCanvas.style.pointerEvents = "auto";
      overlayCanvas.style.cursor = "crosshair";
    }
  }

  function setActiveTool(tool) {
    activeTool = tool;
    drawTemp = null;
    dragState = null;
    hoverMatch = null;
    chartPlot.style.cursor = "";
    updateToolbarUI();
    updateCanvasInteractivity();
  }

  function finishDrawTemp() {
    if (!drawTemp) return;
    if (drawTemp.type === "brush" && drawTemp.points.length < 2) { drawTemp = null; return; }
    drawings.push(drawTemp);
    drawTemp = null;
    setActiveTool("cursor");
    redrawOverlay();
  }

  function drawLineSeg(x1, y1, x2, y2, color, width, dash) {
    overlayCtx.save();
    overlayCtx.strokeStyle = color;
    overlayCtx.lineWidth = width || 1.5;
    overlayCtx.setLineDash(dash || []);
    overlayCtx.beginPath();
    overlayCtx.moveTo(x1, y1);
    overlayCtx.lineTo(x2, y2);
    overlayCtx.stroke();
    overlayCtx.restore();
  }

  // ── Edición de dibujos existentes (mover líneas, puntos de fibo, etc.) ──
  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq ? ((px - x1) * dx + (py - y1) * dy) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return Math.hypot(px - cx, py - cy);
  }

  // Busca si (x,y) cae sobre algún dibujo (o una de sus manijas) — recorre
  // del más nuevo al más viejo para que el último dibujado gane si se
  // superponen. Devuelve { drawing, handle } o null.
  function hitTest(x, y) {
    const HANDLE_R = 8, LINE_TOL = 6, TEXT_PAD = 4;

    for (let i = drawings.length - 1; i >= 0; i--) {
      const d = drawings[i];

      if (d.type === "trendline" || d.type === "fib") {
        const x1 = timeToX(d.p1.t), y1 = priceToY(d.p1.p);
        const x2 = timeToX(d.p2.t), y2 = priceToY(d.p2.p);
        if (x1 == null || y1 == null || x2 == null || y2 == null) continue;
        if (Math.hypot(x - x1, y - y1) <= HANDLE_R) return { drawing: d, handle: "p1" };
        if (Math.hypot(x - x2, y - y2) <= HANDLE_R) return { drawing: d, handle: "p2" };
        if (distToSegment(x, y, x1, y1, x2, y2) <= LINE_TOL) return { drawing: d, handle: "whole" };
      }

      if (d.type === "hline") {
        const y0 = priceToY(d.price);
        if (y0 == null) continue;
        if (Math.abs(y - y0) <= LINE_TOL) return { drawing: d, handle: "whole" };
      }

      if (d.type === "brush") {
        const coords = d.points
          .map(p => [timeToX(p.t), priceToY(p.p)])
          .filter(([px, py]) => px != null && py != null);
        for (let k = 0; k < coords.length - 1; k++) {
          if (distToSegment(x, y, coords[k][0], coords[k][1], coords[k + 1][0], coords[k + 1][1]) <= LINE_TOL) {
            return { drawing: d, handle: "whole" };
          }
        }
      }

      if (d.type === "text") {
        const tx = timeToX(d.t), ty = priceToY(d.p);
        if (tx == null || ty == null) continue;
        overlayCtx.font = "13px 'Segoe UI', sans-serif";
        // Sin texto todavía (recién colocado, placeholder vacío): usamos un
        // ancho mínimo fijo para que el cuadrito se pueda seguir agarrando
        // y moviendo aunque no tenga nada escrito adentro.
        const width = d.text ? overlayCtx.measureText(d.text).width : 70;
        const left = tx + 6 - TEXT_PAD, right = tx + 6 + width + TEXT_PAD;
        const top = ty - 8 - TEXT_PAD, bottom = ty + 8 + TEXT_PAD;
        if (x >= left && x <= right && y >= top && y <= bottom) return { drawing: d, handle: "whole" };
      }
    }
    return null;
  }

  function cursorForMatch(match) {
    if (!match) return "default";
    if (match.handle === "p1" || match.handle === "p2") return "grab";
    if (match.drawing.type === "hline") return "ns-resize";
    return "move";
  }

  function startDrag(match, x, y) {
    const { drawing, handle } = match;
    dragState = { drawing, handle };

    if (handle === "p1" || handle === "p2") {
      // nada que precalcular: en updateDrag() se recalcula ese punto directo
    } else if (drawing.type === "hline") {
      dragState.grabDY = y - priceToY(drawing.price);
    } else if (drawing.type === "text") {
      dragState.grabDX = x - timeToX(drawing.t);
      dragState.grabDY = y - priceToY(drawing.p);
    } else if (drawing.type === "trendline" || drawing.type === "fib") {
      dragState.origP1 = { x: timeToX(drawing.p1.t), y: priceToY(drawing.p1.p) };
      dragState.origP2 = { x: timeToX(drawing.p2.t), y: priceToY(drawing.p2.p) };
      dragState.grabX = x; dragState.grabY = y;
    } else if (drawing.type === "brush") {
      dragState.origPoints = drawing.points.map(p => ({ x: timeToX(p.t), y: priceToY(p.p) }));
      dragState.grabX = x; dragState.grabY = y;
    }

    chartPlot.style.cursor = "grabbing";
  }

  function updateDrag(x, y) {
    const { drawing, handle } = dragState;

    if (handle === "p1" || handle === "p2") {
      const t = xToTime(x), p = yToPrice(y);
      if (t != null && p != null) drawing[handle] = { t, p };
    } else if (drawing.type === "hline") {
      const p = yToPrice(y - dragState.grabDY);
      if (p != null) drawing.price = p;
    } else if (drawing.type === "text") {
      const t = xToTime(x - dragState.grabDX), p = yToPrice(y - dragState.grabDY);
      if (t != null && p != null) { drawing.t = t; drawing.p = p; }
    } else if (drawing.type === "trendline" || drawing.type === "fib") {
      const dx = x - dragState.grabX, dy = y - dragState.grabY;
      const t1 = xToTime(dragState.origP1.x + dx), p1 = yToPrice(dragState.origP1.y + dy);
      const t2 = xToTime(dragState.origP2.x + dx), p2 = yToPrice(dragState.origP2.y + dy);
      if (t1 != null && p1 != null) drawing.p1 = { t: t1, p: p1 };
      if (t2 != null && p2 != null) drawing.p2 = { t: t2, p: p2 };
    } else if (drawing.type === "brush") {
      const dx = x - dragState.grabX, dy = y - dragState.grabY;
      const newPoints = [];
      for (const op of dragState.origPoints) {
        const t = xToTime(op.x + dx), p = yToPrice(op.y + dy);
        if (t == null || p == null) return; // si se sale del rango visible, no tocar este frame
        newPoints.push({ t, p });
      }
      drawing.points = newPoints;
    }

    redrawOverlay();
  }

  function endDrag() {
    dragState = null;
    chartPlot.style.cursor = hoverMatch ? cursorForMatch(hoverMatch) : "";
  }

  function toCanvasXY(e) {
    const rect = overlayCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  // Mientras se arrastra un punto (dragState) o se está trazando un dibujo
  // nuevo (drawTemp), escuchamos en window en vez de en el canvas — así el
  // gesto no se corta si el mouse sale un instante del área del gráfico.
  function onWindowPointerMove(e) {
    const { x, y } = toCanvasXY(e);
    if (dragState) { updateDrag(x, y); return; }
    if (drawTemp) {
      const t = xToTime(x), p = yToPrice(y);
      if (t == null || p == null) return;
      if (drawTemp.type === "brush") drawTemp.points.push({ t, p });
      else drawTemp.p2 = { t, p };
      redrawOverlay();
    }
  }
  function onWindowPointerUp() {
    window.removeEventListener("mousemove", onWindowPointerMove);
    window.removeEventListener("mouseup", onWindowPointerUp);
    if (dragState) { endDrag(); guardarDibujosServidor(); return; }
    finishDrawTemp();
    guardarDibujosServidor();
  }
  function beginWindowCapture() {
    window.addEventListener("mousemove", onWindowPointerMove);
    window.addEventListener("mouseup", onWindowPointerUp);
  }

  // Dibuja las anotaciones del usuario (líneas, fibo, texto, trazo libre)
  // encima del gráfico — recalcula pixel a partir de tiempo/precio guardados,
  // igual que ya se hace con los canales, así se re-ubican solas al hacer
  // zoom/pan/resize.
  function dibujarAnotaciones(w) {
    const all = drawTemp ? [...drawings, drawTemp] : drawings;
    const highlighted = (dragState && dragState.drawing) || (hoverMatch && hoverMatch.drawing) || null;

    all.forEach(d => {
      const isHi = d === highlighted;

      if (d.type === "hline") {
        const y = priceToY(d.price);
        if (y == null) return;
        drawLineSeg(0, y, w, y, d.color, isHi ? 2.5 : 1.5, [4, 3]);
        overlayCtx.save();
        overlayCtx.fillStyle = d.color;
        overlayCtx.font = "11px 'Segoe UI', sans-serif";
        overlayCtx.textBaseline = "bottom";
        overlayCtx.fillText(d.price.toFixed(5), Math.max(4, w - 70), y - 3);
        overlayCtx.restore();
      }

      if (d.type === "trendline") {
        const x1 = timeToX(d.p1.t), y1 = priceToY(d.p1.p);
        const x2 = timeToX(d.p2.t), y2 = priceToY(d.p2.p);
        if (x1 == null || y1 == null || x2 == null || y2 == null) return;
        drawLineSeg(x1, y1, x2, y2, d.color, isHi ? 3 : 2);
        [[x1, y1], [x2, y2]].forEach(([x, y]) => {
          overlayCtx.beginPath();
          overlayCtx.arc(x, y, isHi ? 5 : 3, 0, Math.PI * 2);
          overlayCtx.fillStyle = d.color;
          overlayCtx.fill();
          if (isHi) {
            overlayCtx.lineWidth = 1.5;
            overlayCtx.strokeStyle = "#fff";
            overlayCtx.stroke();
          }
        });
      }

      if (d.type === "brush") {
        const coords = d.points
          .map(p => [timeToX(p.t), priceToY(p.p)])
          .filter(([x, y]) => x != null && y != null);
        if (coords.length < 2) return;
        overlayCtx.save();
        overlayCtx.strokeStyle = d.color;
        overlayCtx.lineWidth = isHi ? 3 : 2;
        overlayCtx.lineJoin = "round";
        overlayCtx.lineCap = "round";
        overlayCtx.beginPath();
        overlayCtx.moveTo(coords[0][0], coords[0][1]);
        coords.slice(1).forEach(([x, y]) => overlayCtx.lineTo(x, y));
        overlayCtx.stroke();
        overlayCtx.restore();
      }

      if (d.type === "text") {
        const x = timeToX(d.t), y = priceToY(d.p);
        if (x == null || y == null) return;
        const vacio = !d.text;
        overlayCtx.save();
        overlayCtx.font = vacio ? "italic 12px 'Segoe UI', sans-serif" : "13px 'Segoe UI', sans-serif";
        const width = vacio ? 70 : overlayCtx.measureText(d.text).width;
        // Vacío (recién colocado, todavía sin escribir) o resaltado por
        // hover: se ve el cuadrito punteado para poder ubicarlo bien antes
        // de escribir (doble clic) — así no hay que adivinar dónde está.
        if (isHi || vacio) {
          overlayCtx.strokeStyle = vacio ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.5)";
          overlayCtx.setLineDash([3, 2]);
          overlayCtx.lineWidth = 1;
          overlayCtx.strokeRect(x + 2, y - 12, width + 8, 24);
        }
        overlayCtx.fillStyle = vacio ? "rgba(255,255,255,.45)" : d.color;
        overlayCtx.textBaseline = "middle";
        overlayCtx.fillText(vacio ? "doble clic…" : d.text, x + 6, y);
        overlayCtx.restore();
      }

      if (d.type === "fib") {
        const x1 = timeToX(d.p1.t), y1 = priceToY(d.p1.p);
        const x2 = timeToX(d.p2.t), y2 = priceToY(d.p2.p);
        if (x1 == null || y1 == null || x2 == null || y2 == null) return;
        const levels = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
        const xLeft  = Math.min(x1, x2);
        const xRight = Math.max(x1, x2) + 40;
        levels.forEach(lv => {
          const price = d.p1.p + (d.p2.p - d.p1.p) * lv;
          const y = priceToY(price);
          if (y == null) return;
          drawLineSeg(xLeft, y, xRight, y, d.color, isHi ? 1.5 : 1);
          overlayCtx.save();
          overlayCtx.fillStyle = d.color;
          overlayCtx.font = "10px 'Segoe UI', sans-serif";
          overlayCtx.textBaseline = "bottom";
          overlayCtx.fillText(`${(lv * 100).toFixed(1)}%  ${price.toFixed(5)}`, xRight + 4, y + 3);
          overlayCtx.restore();
        });
        drawLineSeg(x1, y1, x2, y2, d.color, isHi ? 1.5 : 1, [2, 2]);
        [[x1, y1], [x2, y2]].forEach(([x, y]) => {
          overlayCtx.beginPath();
          overlayCtx.arc(x, y, isHi ? 5 : 3, 0, Math.PI * 2);
          overlayCtx.fillStyle = d.color;
          overlayCtx.fill();
          if (isHi) {
            overlayCtx.lineWidth = 1.5;
            overlayCtx.strokeStyle = "#fff";
            overlayCtx.stroke();
          }
        });
      }
    });
  }

  function actualizarTogglesDisponibles() {
    const gruposPresentes = new Set(currentChannels.map(ch => grupoDeCanal(ch.label)));
    lblLargo.style.display   = gruposPresentes.has("largo")   ? "flex" : "none";
    lblMediano.style.display = gruposPresentes.has("mediano") ? "flex" : "none";
    lblCorto.style.display   = gruposPresentes.has("corto")   ? "flex" : "none";
    // Al ocultarse/mostrarse canales cambia el conjunto sobre el que
    // actúa el botón, así que su etiqueta se recalcula acá también.
    actualizarBtnTodos();
  }

  // Reemplaza las tarjetas flotantes que antes aparecían pegadas al final
  // de cada línea DENTRO del gráfico (estorbando el análisis) — ahora es
  // una leyenda chiquita arriba, al lado de los checkboxes. Solo lista
  // los canales que están efectivamente visibles (respeta filtroCanales).
  function actualizarLeyenda() {
    channelLegend.innerHTML = "";
    currentChannels
      .filter(ch => filtroCanales[grupoDeCanal(ch.label)])
      .forEach(ch => {
        const item = document.createElement("span");
        item.className = "leg-item";
        item.innerHTML =
          `<span class="leg-dot" style="background:${ch.color}"></span>${ch.label} (${Math.round(ch.quality * 100)}%)`;
        channelLegend.appendChild(item);
      });
  }

  const hastaCorte = (arr, f) => (limiteDerecha === null ? arr : arr.filter(x => f(x) <= limiteDerecha));
  const toSeriesData = pts => hastaCorte(pts, p => p.t).map(p => ({ time: p.t, value: p.y }));

  function dibujarCanales() {
    channelSeriesList.forEach(s => chart.removeSeries(s));
    channelSeriesList = [];

    currentChannels.forEach(ch => {
      if (!filtroCanales[grupoDeCanal(ch.label)]) return;

      const lw = Math.max(1, Math.min(4, Math.round(ch.linewidth || 2)));

      // Sin "title": eso es lo que hace que lightweight-charts dibuje la
      // tarjeta flotante pegada al final de la línea, adentro del gráfico
      // (estorbando el análisis). El nombre + calidad de cada canal ahora
      // se muestra aparte, en la leyenda de arriba (actualizarLeyenda()).
      const base = chart.addLineSeries({
        color: ch.color, lineWidth: lw, priceLineVisible:false, lastValueVisible:false, title:"",
      });
      base.setData(toSeriesData(ch.base_points));
      channelSeriesList.push(base);

      const par = chart.addLineSeries({
        color: ch.color, lineWidth: lw, priceLineVisible:false, lastValueVisible:false, title:"",
      });
      par.setData(toSeriesData(ch.par_points));
      channelSeriesList.push(par);

      const mid = chart.addLineSeries({
        color: hexToRgba(ch.color, 0.8), lineWidth: 1, lineStyle: 2,
        priceLineVisible:false, lastValueVisible:false, title:"",
      });
      mid.setData(toSeriesData(ch.mid_points));
      channelSeriesList.push(mid);
    });

    actualizarLeyenda();
    requestAnimationFrame(() => requestAnimationFrame(redrawOverlay));
  }

  // ── Indicador "KN - Smart TP SL Signals" (portado desde Pine Script) ──
  // Cruce EMA rápida/lenta + SL por ATR + 3 objetivos por RR. Todo se
  // calcula acá mismo, sobre las velas que ya están cargadas — no hace
  // falta pedirle nada nuevo al servidor. Parámetros iguales a los
  // defaults del indicador original en TradingView.
  const KN_EMA_FAST = 5;
  const KN_EMA_SLOW = 13;
  const KN_ATR_LEN = 14;
  const KN_SL_MULT = 1.5;
  const KN_RR = [1, 2, 3];
  const KN_LINE_BARS = 30; // cuántas velas se extienden las líneas hacia la derecha

  function knEma(values, length) {
    const k = 2 / (length + 1);
    const out = new Array(values.length);
    out[0] = values[0];
    for (let i = 1; i < values.length; i++) out[i] = values[i] * k + out[i - 1] * (1 - k);
    return out;
  }

  // Calcula la señal más reciente (cruce alcista o bajista) y si sus
  // TP1/TP2/TP3/SL ya fueron tocados por las velas posteriores dentro
  // del historial cargado — igual que el "showOnlyLatest" de Pine.
  function calcularKN(candles) {
    const n = candles.length;
    const minBars = Math.max(KN_EMA_SLOW, KN_ATR_LEN) + 2;
    if (n < minBars) return null;

    const closes = candles.map(c => c.close);
    const highs = candles.map(c => c.high);
    const lows = candles.map(c => c.low);

    const emaFast = knEma(closes, KN_EMA_FAST);
    const emaSlow = knEma(closes, KN_EMA_SLOW);

    // True Range + ATR (suavizado de Wilder, igual que ta.atr en Pine).
    const tr = new Array(n);
    tr[0] = highs[0] - lows[0];
    for (let i = 1; i < n; i++) {
      tr[i] = Math.max(
        highs[i] - lows[i],
        Math.abs(highs[i] - closes[i - 1]),
        Math.abs(lows[i] - closes[i - 1]),
      );
    }
    const atr = new Array(n).fill(null);
    if (n >= KN_ATR_LEN) {
      let seed = 0;
      for (let i = 0; i < KN_ATR_LEN; i++) seed += tr[i];
      atr[KN_ATR_LEN - 1] = seed / KN_ATR_LEN;
      for (let i = KN_ATR_LEN; i < n; i++) {
        atr[i] = (atr[i - 1] * (KN_ATR_LEN - 1) + tr[i]) / KN_ATR_LEN;
      }
    }

    // Buscamos el cruce más reciente, yendo hacia atrás desde la última vela.
    const minIdx = Math.max(KN_EMA_SLOW, KN_ATR_LEN);
    let signalIdx = -1, dir = 0;
    for (let i = n - 1; i >= minIdx; i--) {
      const crossUp = emaFast[i - 1] <= emaSlow[i - 1] && emaFast[i] > emaSlow[i];
      const crossDown = emaFast[i - 1] >= emaSlow[i - 1] && emaFast[i] < emaSlow[i];
      if (crossUp) { signalIdx = i; dir = 1; break; }
      if (crossDown) { signalIdx = i; dir = -1; break; }
    }
    if (signalIdx === -1 || atr[signalIdx] == null) return null;

    const entry = closes[signalIdx];
    const risk = atr[signalIdx] * KN_SL_MULT;
    const sl = dir === 1 ? entry - risk : entry + risk;
    const tp1 = dir === 1 ? entry + risk * KN_RR[0] : entry - risk * KN_RR[0];
    const tp2 = dir === 1 ? entry + risk * KN_RR[1] : entry - risk * KN_RR[1];
    const tp3 = dir === 1 ? entry + risk * KN_RR[2] : entry - risk * KN_RR[2];

    let tp1Hit = false, tp2Hit = false, tp3Hit = false, slHit = false;
    for (let i = signalIdx; i < n; i++) {
      if (dir === 1) {
        if (!tp1Hit && highs[i] >= tp1) tp1Hit = true;
        if (!tp2Hit && highs[i] >= tp2) tp2Hit = true;
        if (!tp3Hit && highs[i] >= tp3) tp3Hit = true;
        if (!slHit && lows[i] <= sl) slHit = true;
      } else {
        if (!tp1Hit && lows[i] <= tp1) tp1Hit = true;
        if (!tp2Hit && lows[i] <= tp2) tp2Hit = true;
        if (!tp3Hit && lows[i] <= tp3) tp3Hit = true;
        if (!slHit && highs[i] >= sl) slHit = true;
      }
    }

    // IMPORTANTE: NO se puede asumir un intervalo fijo entre velas. En
    // timeframes como D1 el mercado no opera fines de semana/feriados, así
    // que hay saltos de 1 día mezclados con saltos de 2-3 días. Si se usa
    // un solo "barInterval" constante (p.ej. tomado de las últimas 2
    // velas) para generar la grilla de toda la línea, se desalinea en cada
    // salto y distorsiona los canales (el bug volvía a aparecer en D1
    // aunque ya no pasaba en H1 dentro de rangos cortos sin fin de semana).
    //
    // Solución: para el tramo histórico (signalIdx -> última vela) usamos
    // los timestamps REALES de las velas, así siempre coinciden exacto
    // con la grilla del gráfico. Para el tramo de proyección hacia el
    // futuro (donde no hay velas reales) usamos un intervalo típico
    // (mediana de los últimos gaps, ignorando saltos de fin de semana).
    const realTimes = candles.slice(signalIdx, n).map(c => c.time);

    const lookback = Math.min(60, n - 1);
    const gaps = [];
    for (let i = n - lookback; i < n; i++) {
      if (i > 0) gaps.push(candles[i].time - candles[i - 1].time);
    }
    gaps.sort((a, b) => a - b);
    const typicalInterval = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 3600;

    const lastRealTime = candles[n - 1].time;
    const futureTimes = [];
    for (let i = 1; i <= KN_LINE_BARS; i++) futureTimes.push(lastRealTime + typicalInterval * i);

    const allTimes = realTimes.concat(futureTimes);
    const lineEndTime = futureTimes[futureTimes.length - 1];

    return {
      dir, signalTime: candles[signalIdx].time, lineEndTime, allTimes,
      entry, sl, tp1, tp2, tp3, tp1Hit, tp2Hit, tp3Hit, slHit,
    };
  }

  // ══════════════════════════════════════════════════════════
  // S/R Avanzado — port del indicador Pine "Advanced Support and
  // Resistance with Reversal | AlphaPine". Igual que KN, se calcula acá
  // en el navegador sobre las velas ya cargadas (no pide nada nuevo al
  // servidor). Réplica bar-a-bar de la máquina de estados del Pine
  // (ACTIVE → BROKEN → RETESTED) para que los índices de ruptura/retest
  // queden en la misma barra que en TradingView, en vez de recalcular
  // todo "en bloque" de forma no causal.
  //
  // Simplificaciones respecto al Pine original (para no duplicar cada
  // input del indicador acá): confirmación de ruptura y de retest SIEMPRE
  // por cierre confirmado (equivalente a "Close" en ambos combos, que es
  // el modo por defecto), sin filtro de mecha dominante y sin buffer de
  // ATR en la ruptura (breakout_atr_buf = 0). El resto de la lógica
  // (fusión por ATR, tope de niveles, expiración por lookback,
  // invalidación de flips) es un calco 1:1.
  const SR_PIVOT_LENGTH    = 10;
  const SR_LOOKBACK        = 200;
  const SR_MAX_LEVELS      = 30;
  const SR_MERGE_ATR_MULT  = 0.5;
  const SR_ATR_LEN         = 14;
  // Equivalentes a los inputs show_reversals / show_breakouts /
  // show_failures del Pine. Apagados por defecto para un gráfico limpio
  // (igual al indicador visto en TradingView): sin flechas de ruptura,
  // sin cruces "X" de invalidación y sin niveles de rol invertido
  // (R→S/S→R) que se superponen con R1-R4/S1-S4. Un nivel roto se queda
  // como línea corta sin etiqueta (igual que en TradingView) en vez de
  // seguir "vivo" como flip.
  const SR_SHOW_REVERSALS  = false;
  const SR_SHOW_BREAKOUTS  = false;
  const SR_SHOW_FAILURES   = false;

  function srAtrWilder(highs, lows, closes, length) {
    const n = highs.length;
    const tr = new Array(n);
    tr[0] = highs[0] - lows[0];
    for (let i = 1; i < n; i++) {
      tr[i] = Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1]));
    }
    const atr = new Array(n).fill(null);
    if (n >= length) {
      let seed = 0;
      for (let i = 0; i < length; i++) seed += tr[i];
      atr[length - 1] = seed / length;
      for (let i = length; i < n; i++) atr[i] = (atr[i - 1] * (length - 1) + tr[i]) / length;
    }
    return atr;
  }

  // high[i] es pivote alto (o low[i] pivote bajo) si es el extremo de la
  // ventana [i-len, i+len] — equivalente práctico a ta.pivothigh/pivotlow.
  function srIsPivotHigh(highs, i, len) {
    if (i < len || i > highs.length - 1 - len) return false;
    const v = highs[i];
    for (let k = i - len; k <= i + len; k++) if (k !== i && highs[k] > v) return false;
    return true;
  }
  function srIsPivotLow(lows, i, len) {
    if (i < len || i > lows.length - 1 - len) return false;
    const v = lows[i];
    for (let k = i - len; k <= i + len; k++) if (k !== i && lows[k] < v) return false;
    return true;
  }

  const SR_STATE_ACTIVE = 0, SR_STATE_BROKEN = 1, SR_STATE_RETESTED = 2;

  function calcularSR(candles) {
    const n = candles.length;
    const minBars = SR_PIVOT_LENGTH * 2 + 2;
    if (n < minBars) return null;

    const highs = candles.map(c => c.high);
    const lows = candles.map(c => c.low);
    const closes = candles.map(c => c.close);
    const opens = candles.map(c => c.open);
    const atr = srAtrWilder(highs, lows, closes, SR_ATR_LEN);

    // Un "tipo" (resistencia o soporte) = un juego de arrays alineados
    // por índice, igual que los pares indexes_r/indexes_s del Pine.
    const mkType = () => ({
      idx: [], confirmIdx: [], price: [], zoneTop: [], zoneBottom: [],
      state: [], breakoutIdx: [],
    });
    const res = mkType(), sup = mkType();
    const flips = []; // { price, zoneTop, zoneBottom, origIdx, breakoutIdx, isSupport, failIdx }
    const breakoutMarkers = [], failureMarkers = [];

    function processType(t, isRes, i) {
      // Expirar niveles cuyo pivote original ya quedó fuera del lookback.
      for (let k = t.idx.length - 1; k >= 0; k--) {
        if (i - t.idx[k] > SR_LOOKBACK) {
