          t.idx.splice(k, 1); t.confirmIdx.splice(k, 1); t.price.splice(k, 1);
          t.zoneTop.splice(k, 1); t.zoneBottom.splice(k, 1); t.state.splice(k, 1); t.breakoutIdx.splice(k, 1);
        }
      }

      // Registrar un pivote recién confirmado en esta barra.
      const pivotIdx = i - SR_PIVOT_LENGTH;
      const isPivot = isRes ? srIsPivotHigh(highs, pivotIdx, SR_PIVOT_LENGTH) : srIsPivotLow(lows, pivotIdx, SR_PIVOT_LENGTH);
      if (isPivot) {
        const pivotPrice = isRes ? highs[pivotIdx] : lows[pivotIdx];
        const zTop = isRes ? pivotPrice : Math.max(opens[pivotIdx], closes[pivotIdx]);
        const zBot = isRes ? Math.min(opens[pivotIdx], closes[pivotIdx]) : pivotPrice;
        let mergeOk = true;
        if (atr[i] != null) {
          for (let k = 0; k < t.price.length; k++) {
            if (t.state[k] === SR_STATE_ACTIVE && Math.abs(t.price[k] - pivotPrice) <= atr[i] * SR_MERGE_ATR_MULT) { mergeOk = false; break; }
          }
        }
        if (mergeOk) {
          t.idx.push(pivotIdx); t.confirmIdx.push(i); t.price.push(pivotPrice);
          t.zoneTop.push(zTop); t.zoneBottom.push(zBot); t.state.push(SR_STATE_ACTIVE); t.breakoutIdx.push(null);
          if (t.idx.length > SR_MAX_LEVELS) {
            t.idx.shift(); t.confirmIdx.shift(); t.price.shift(); t.zoneTop.shift(); t.zoneBottom.shift(); t.state.shift(); t.breakoutIdx.shift();
          }
        }
      }

      // Rupturas y retests (rol invertido), por cierre confirmado.
      for (let k = 0; k < t.idx.length; k++) {
        const st = t.state[k];
        if (st === SR_STATE_ACTIVE) {
          const breakLevel = isRes ? t.zoneTop[k] : t.zoneBottom[k];
          const crossed = isRes ? closes[i] > breakLevel : closes[i] < breakLevel;
          if (crossed) {
            t.state[k] = SR_STATE_BROKEN; t.breakoutIdx[k] = i;
            if (SR_SHOW_BREAKOUTS) breakoutMarkers.push({ idx: i, isRes });
          }
        } else if (st === SR_STATE_BROKEN && SR_SHOW_REVERSALS && i > t.breakoutIdx[k]) {
          const zTop = t.zoneTop[k], zBot = t.zoneBottom[k];
          const touched = highs[i] >= zBot && lows[i] <= zTop;
          const heldNewSide = isRes ? closes[i] >= zTop : closes[i] <= zBot;
          if (touched && heldNewSide) {
            t.state[k] = SR_STATE_RETESTED;
            flips.push({
              price: t.price[k], zoneTop: zTop, zoneBottom: zBot,
              origIdx: t.idx[k], breakoutIdx: t.breakoutIdx[k], isSupport: isRes, failIdx: null,
            });
            if (flips.length > SR_MAX_LEVELS * 2) flips.shift();
          }
        }
      }
    }

    for (let i = 0; i < n; i++) {
      // Invalidar flips con cierre confirmado más allá del lado lejano de su zona.
      for (let k = flips.length - 1; k >= 0; k--) {
        const f = flips[k];
        const expired = i - f.origIdx > SR_LOOKBACK;
        const failed = f.isSupport ? closes[i] < f.zoneBottom : closes[i] > f.zoneTop;
        if (failed && f.failIdx === null && SR_SHOW_FAILURES) {
          failureMarkers.push({ idx: i, isSupport: f.isSupport });
        }
        if (expired || failed) flips.splice(k, 1);
      }
      processType(res, true, i);
      processType(sup, false, i);
    }

    // Serializar para dibujar: línea desde la confirmación hasta la
    // última barra (o hasta la ruptura, si ya no está activo), tiempos
    // reales de las velas (igual criterio que channel_payload/KN, para
    // no desalinearse en D1 por los huecos de fin de semana).
    const lastIdx = n - 1;
    function serializeType(t, prefix) {
      const out = [];
      for (let k = 0; k < t.idx.length; k++) {
        const st = t.state[k];
        const endIdx = st === SR_STATE_ACTIVE ? lastIdx : t.breakoutIdx[k];
        if (endIdx <= t.confirmIdx[k]) continue;
        const points = candles.slice(t.confirmIdx[k], endIdx + 1).map(c => ({ time: c.time, value: t.price[k] }));
        const isValid = st === SR_STATE_ACTIVE && (prefix === "R" ? t.price[k] > closes[lastIdx] : t.price[k] < closes[lastIdx]);
        out.push({ price: t.price[k], points, endTime: candles[endIdx].time, active: st === SR_STATE_ACTIVE, valid: isValid });
      }
      return out;
    }
    const resistances = serializeType(res, "R");
    const supports = serializeType(sup, "S");

    // Numeración R1..Rn (más cerca del precio primero) / S1..Sn — igual
    // que el sort() + drawPriceLabel() del Pine.
    const validRes = resistances.filter(l => l.valid).sort((a, b) => a.price - b.price);
    const validSup = supports.filter(l => l.valid).sort((a, b) => b.price - a.price);
    validRes.forEach((l, i) => { l.label = `R${i + 1}: ${l.price.toFixed(5)}`; });
    validSup.forEach((l, i) => { l.label = `S${i + 1}: ${l.price.toFixed(5)}`; });

    const flipsOut = flips.map(f => ({
      price: f.price,
      points: candles.slice(f.breakoutIdx, lastIdx + 1).map(c => ({ time: c.time, value: f.price })),
      endTime: candles[lastIdx].time,
      isSupport: f.isSupport,
      label: (f.isSupport ? "RS: " : "SR: ") + f.price.toFixed(5),
    }));

    return {
      resistances, supports, flips: flipsOut,
      breakoutMarkers: breakoutMarkers.map(m => ({ time: candles[m.idx].time, isRes: m.isRes })),
      failureMarkers: failureMarkers.map(m => ({ time: candles[m.idx].time, isSupport: m.isSupport })),
    };
  }

  // Dibuja las líneas ENTRY/SL/TP1-3 desde la barra de la señal hacia la
  // derecha (mismo criterio que las líneas de line.new() en Pine) y
  // actualiza el chip de texto "KN: ...". Los marcadores BUY/SELL se
  // agregan aparte, dentro de dibujarKalmanYMarkers(), para no pisar el
  // único setMarkers() que admite la serie de velas.
  function dibujarKN() {
    knSeriesList.forEach(s => chart.removeSeries(s));
    knSeriesList = [];

    if (!mostrarKN || !currentKN) {
      sigKn.textContent = "KN: —";
      sigKn.className = "sig-kn";
      requestAnimationFrame(redrawOverlay);
      return;
    }

    const k = currentKN;
    const hitColor = "#26a69a";
    const slColor = "#ff9800";
    const slHitColor = "#ef5350";
    const tpColor = "#29b6f6";
    const fmt = v => v.toFixed(5);

    const mkLine = (level, color, width, dashed, title) => {
      const s = chart.addLineSeries({
        color, lineWidth: width,
        lineStyle: dashed ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Solid,
        priceLineVisible: false, lastValueVisible: false, title,
      });
      // IMPORTANTE: lightweight-charts espacia las barras según la cantidad
      // de puntos de datos existentes entre dos tiempos, no según el tiempo
      // real transcurrido. Con solo 2 puntos (inicio y fin) la línea queda
      // pegada al principio sin importar qué tan lejos esté lineEndTime,
      // porque no hay ninguna otra serie con datos en el medio. Generamos
      // puntos intermedios para que la línea tenga ancho real en pantalla.
      //
      // OJO: los puntos intermedios tienen que caer EXACTAMENTE sobre la
      // misma grilla de tiempo que las velas reales. Usar un solo intervalo
      // fijo (barInterval) para toda la línea no sirve: en timeframes como
      // D1 el mercado no opera fines de semana/feriados, así que hay
      // saltos de 1 día mezclados con saltos de 2-3 días, y un paso
      // constante se desalinea en cada salto. Por eso k.allTimes ya trae,
      // desde calcularKN(), los timestamps REALES de cada vela para el
      // tramo histórico (perfectamente alineados) y solo usa un intervalo
      // típico para el tramo de proyección hacia el futuro (donde no hay
      // velas reales con las que desalinearse).
      const data = hastaCorte(k.allTimes, t => t).map(t => ({ time: t, value: level }));
      s.setData(data);
      knSeriesList.push(s);
    };

    mkLine(k.entry, "#9aa0a6", 2, false, "");
    mkLine(k.sl, k.slHit ? slHitColor : slColor, 2, false, "");
    mkLine(k.tp1, k.tp1Hit ? hitColor : tpColor, 1, !k.tp1Hit, "");
    mkLine(k.tp2, k.tp2Hit ? hitColor : tpColor, 1, !k.tp2Hit, "");
    mkLine(k.tp3, k.tp3Hit ? hitColor : tpColor, 2, false, "");

    const estado = k.slHit ? "SL ✕" : k.tp3Hit ? "TP3 ✓" : k.tp2Hit ? "TP2 ✓" : k.tp1Hit ? "TP1 ✓" : "en curso";
    sigKn.textContent = `KN: ${k.dir === 1 ? "Buy" : "Sell"} (${estado})`;
    sigKn.className = "sig-kn chip " + (k.dir === 1 ? "chip-buy" : "chip-sell");

    requestAnimationFrame(redrawOverlay);
  }

  // Dibuja las líneas del Kalman Flow + los marcadores (flips Long/Short +
  // pivotes) — separado de dibujarCanales() para poder togglear el Kalman
  // con el checkbox sin volver a pedirle nada al servidor (currentKalman/
  // currentPivots ya están guardados desde la última carga).
  function dibujarKalmanYMarkers() {
    overlaySeries.forEach(s => chart.removeSeries(s));
    overlaySeries = [];

    const markers = [];

    if (currentKalman && mostrarKalman) {
      currentKalman.segments.forEach(seg => {
        const s = chart.addLineSeries({
          color: seg.color, lineWidth: 2, priceLineVisible:false, lastValueVisible:false, title:"",
        });
        s.setData(seg.points);
        overlaySeries.push(s);
      });
      currentKalman.flips_up.forEach(p => markers.push({
        time: p.time, position: "belowBar", color: "#30FDCF", shape: "arrowUp", text: "Long",
      }));
      currentKalman.flips_down.forEach(p => markers.push({
        time: p.time, position: "aboveBar", color: "#E117B7", shape: "arrowDown", text: "Short",
      }));
    }

    currentPivots.forEach(p => markers.push({
      time: p.time,
      position: p.type === "high" ? "aboveBar" : "belowBar",
      color: p.type === "high" ? "#FF5252" : "#00E676",
      shape: p.type === "high" ? "arrowDown" : "arrowUp",
      text: "",
    }));

    if (currentKN && mostrarKN) {
      markers.push({
        time: currentKN.signalTime,
        position: currentKN.dir === 1 ? "belowBar" : "aboveBar",
        color: currentKN.dir === 1 ? "#00e676" : "#ff5252",
        shape: currentKN.dir === 1 ? "arrowUp" : "arrowDown",
        text: currentKN.dir === 1 ? "KN BUY" : "KN SELL",
      });
    }

    if (currentSR && mostrarSR) {
      currentSR.breakoutMarkers.forEach(m => markers.push({
        time: m.time,
        position: m.isRes ? "belowBar" : "aboveBar",
        color: m.isRes ? "#2962ff" : "#ff9800", // res_breakout_col / sup_breakout_col del Pine
        shape: m.isRes ? "arrowUp" : "arrowDown",
        text: "",
      }));
      currentSR.failureMarkers.forEach(m => markers.push({
        time: m.time,
        position: m.isSupport ? "belowBar" : "aboveBar",
        color: m.isSupport ? "#ef5350" : "#00e676", // support_fail_col / resistance_fail_col del Pine
        shape: "circle",
        text: m.isSupport ? "S ✕" : "R ✕",
      }));
    }

    if (currentSRF && mostrarSRF) {
      currentSRF.mayores.forEach(f => markers.push({
        time: f.time,
        position: f.isHigh ? "aboveBar" : "belowBar",
        color: f.isHigh ? "#ef5350" : "#26a69a",
        shape: "circle",
        size: 0.6,
        text: "",
      }));
    }

    // Secuencia estructural: el fractal que originó la estructura, la vela
    // del desplazamiento y la confirmación de continuación. Solo de las
    // estructuras dibujables, para no tapar el gráfico de puntos.
    if (currentSEQ && mostrarSEQ) {
      currentSEQ.visibles.forEach(s => {
        const viva = s.estado !== "INVALIDADO";
        const col = viva ? (s.dir > 0 ? "#26a69a" : "#ef5350") : "#5d606b";
        if (seqCapas.fractales) {
          markers.push({
            time: s.fractal.time,
            position: s.dir > 0 ? "aboveBar" : "belowBar",
            color: col, shape: "circle", size: 0.7, text: "",
          });
        }
        if (seqCapas.flechas && s.desplazamiento) {
          markers.push({
            time: s.desplazamiento.time,
            position: s.dir > 0 ? "belowBar" : "aboveBar",
            color: col, shape: s.dir > 0 ? "arrowUp" : "arrowDown", text: "",
          });
        }
        if (seqCapas.flechas && s.continuacion) {
          markers.push({
            time: s.continuacion.time,
            position: s.dir > 0 ? "belowBar" : "aboveBar",
            color: viva ? "#00e676" : "#5d606b",
            shape: s.dir > 0 ? "arrowUp" : "arrowDown",
            text: `${s.dir > 0 ? "COMPRA" : "VENTA"} ${s.score}`,
          });
        }
      });
    }

    markers.sort((a, b) => a.time - b.time);
    candleSerie.setMarkers(markers);
  }

  // Dibuja las líneas de niveles S/R (resistencia/soporte activos y ya
  // rotos, más los flips R→S / S→R) — mismo mecanismo que dibujarKN():
  // una addLineSeries por nivel, con un punto por vela real para que
  // quede perfectamente alineada con el eje de tiempo. Las etiquetas
  // (banderas R1/S1/RS/SR) se dibujan aparte, en redrawOverlay(), porque
  // van sobre el canvas de overlay, no sobre una serie del chart.
  function dibujarSR() {
    srSeriesList.forEach(s => chart.removeSeries(s));
    srSeriesList = [];

    if (!mostrarSR || !currentSR) {
      requestAnimationFrame(redrawOverlay);
      return;
    }

    const resColor = "#ef5350";      // resistance_line_col por defecto del Pine
    const supColor = "#26a69a";      // support_line_col por defecto del Pine
    const rsColor = "#26a69a";       // R→S (nuevo rol = soporte)
    const srColor = "#ef5350";       // S→R (nuevo rol = resistencia)

    const mkLevelLine = (points, color, width) => {
      if (points.length < 1) return;
      const s = chart.addLineSeries({
        color, lineWidth: width, priceLineVisible: false, lastValueVisible: false, title: "",
      });
      const pts = hastaCorte(points, q => q.time);
      if (!pts.length) return;
      s.setData(pts.length === 1 ? [pts[0], pts[0]] : pts);
      srSeriesList.push(s);
    };

    currentSR.resistances.forEach(l => mkLevelLine(l.points, resColor, l.active ? 1 : 1));
    currentSR.supports.forEach(l => mkLevelLine(l.points, supColor, l.active ? 1 : 1));
    currentSR.flips.forEach(f => mkLevelLine(f.points, f.isSupport ? rsColor : srColor, 2));

    requestAnimationFrame(redrawOverlay);
  }

  // Dibuja una "bandera" (rectángulo redondeado + triángulo apuntando al
  // nivel) con el texto indicado, pegada en x al final de la línea del
  // nivel — igual al estilo de las etiquetas ENTRY/TP/SL de TradingView.
  function dibujarBanderaKN(x, y, text, bgColor) {
    if (x == null || y == null) return;
    const wCanvas = overlayCanvas.clientWidth;
    const gap = 10; // separación entre el final de la línea del nivel y la bandera

    overlayCtx.save();
    overlayCtx.font = "bold 11px 'Segoe UI', sans-serif";
    const textWidth = overlayCtx.measureText(text).width;
    const boxH = 20, triW = 7, padX = 9, radius = 4;
    const boxW = textWidth + padX * 2;

    // Que la bandera no se salga del canvas por la derecha ni quede
    // pegada al borde izquierdo si el zoom la deja muy comprimida.
    let bx = Math.min(x + gap, wCanvas - boxW - triW - 4);
    bx = Math.max(bx, triW + 2);

    overlayCtx.fillStyle = bgColor;

    // Triángulo apuntando hacia el nivel
    overlayCtx.beginPath();
    overlayCtx.moveTo(bx, y);
    overlayCtx.lineTo(bx + triW, y - boxH / 2);
    overlayCtx.lineTo(bx + triW, y + boxH / 2);
    overlayCtx.closePath();
    overlayCtx.fill();

    // Cuerpo redondeado con el texto
    const rx = bx + triW, ry = y - boxH / 2;
    overlayCtx.beginPath();
    overlayCtx.moveTo(rx + radius, ry);
    overlayCtx.arcTo(rx + boxW, ry, rx + boxW, ry + boxH, radius);
    overlayCtx.arcTo(rx + boxW, ry + boxH, rx, ry + boxH, radius);
    overlayCtx.arcTo(rx, ry + boxH, rx, ry, radius);
    overlayCtx.arcTo(rx, ry, rx + boxW, ry, radius);
    overlayCtx.closePath();
    overlayCtx.fill();

    overlayCtx.fillStyle = "#0b0e14";
    overlayCtx.textBaseline = "middle";
    overlayCtx.textAlign = "left";
    overlayCtx.fillText(text, rx + padX, y + 0.5);
    overlayCtx.restore();
  }

  // ══════════════════════════════════════════════════════════
  // S/R Fractal — zonas donde se agrupan fractales importantes. El motor
  // vive en chartview/static/chartview/fractal_sr.js (puro, sin DOM, con
  // pruebas); acá solo se calcula sobre las velas cargadas y se dibuja.
  // ══════════════════════════════════════════════════════════
  function calcularSRFractal(candles) {
    if (!window.FractalSR) return null;
    try { return window.FractalSR.calcular(candles); }
    catch (e) { console.error("S/R Fractal:", e); return null; }
  }

  // Decimales según el precio del instrumento (no según el valor): así el
  // ATR del oro sale "19.37" y no "19.36754", y el de JPY con 3 decimales.
  function fmtPrecioSRF(v) {
    const a = currentSRF && currentSRF.close ? Math.abs(currentSRF.close) : Math.abs(v);
    return v.toFixed(a >= 1000 ? 2 : a >= 20 ? 3 : 5);
  }

  const SRF_COLORES = { R: "#ef5350", S: "#26a69a", Z: "#ffb300" };
  const SRF_ALFA = { MAYOR: 0.24, IMPORTANTE: 0.16, MENOR: 0.09, BAJO: 0.06 };

  function dibujarZonasSRF(w) {
    if (!mostrarSRF || !currentSRF) return;
    const ts = chart.timeScale();
    // Las zonas terminan donde empieza la escala de precios (no la tapan).
    let anchoEscala = 0;
    try { anchoEscala = chart.priceScale("right").width() || 0; } catch (e) { anchoEscala = 0; }
    const xFin = w - anchoEscala;
    const etiquetas = [];

    currentSRF.zones.forEach(z => {
      const yTop = candleSerie.priceToCoordinate(z.top);
      const yBot = candleSerie.priceToCoordinate(z.bottom);
      if (yTop === null || yBot === null) return;
      let x0 = ts.timeToCoordinate(z.confirmTime);
      x0 = x0 === null ? 0 : Math.max(0, x0);
      if (x0 >= xFin) return;
      const color = SRF_COLORES[z.tipo];
      const y1 = Math.min(yTop, yBot), alto = Math.max(2, Math.abs(yBot - yTop));

      overlayCtx.save();
      const resaltada = z === srfResaltada;
      overlayCtx.fillStyle = hexToRgba(color, (SRF_ALFA[z.clase] || 0.08) * (resaltada ? 2.2 : 1));
      overlayCtx.fillRect(x0, y1, xFin - x0, alto);
      overlayCtx.strokeStyle = hexToRgba(color, resaltada || z.clase === "MAYOR" ? 0.95 : 0.55);
      overlayCtx.lineWidth = resaltada ? 2.5 : z.clase === "MAYOR" ? 1.5 : 1;
      if (z.clase === "MENOR" && !resaltada) overlayCtx.setLineDash([4, 4]);
      overlayCtx.beginPath();
      overlayCtx.moveTo(x0, y1); overlayCtx.lineTo(xFin, y1);
      overlayCtx.moveTo(x0, y1 + alto); overlayCtx.lineTo(xFin, y1 + alto);
      overlayCtx.stroke();
      overlayCtx.restore();

      etiquetas.push({
        yZona: y1 + alto / 2, color,
        texto: `${z.etiqueta} ${fmtPrecioSRF(z.mid)} · ${Math.round(z.fuerza)}` + (z.polaridad ? " ⇅" : ""),
      });
    });

    // Etiquetas alineadas a la derecha del área de velas, separadas para
    // que no se encimen; si una se desplaza, una guía la une a su zona.
    const altoEt = 18, sep = 3;
    etiquetas.sort((a, b) => a.yZona - b.yZona);
    etiquetas.forEach((e, i) => {
      e.y = e.yZona;
      if (i > 0) e.y = Math.max(e.y, etiquetas[i - 1].y + altoEt + sep);
    });
    overlayCtx.save();
    overlayCtx.font = "bold 11px 'Segoe UI', sans-serif";
    overlayCtx.textBaseline = "middle";
    etiquetas.forEach(e => {
      const anchoTxt = overlayCtx.measureText(e.texto).width + 14;
      const bx = xFin - anchoTxt - 6;
      if (Math.abs(e.y - e.yZona) > 1) {
        overlayCtx.strokeStyle = hexToRgba(e.color, 0.8);
        overlayCtx.lineWidth = 1;
        overlayCtx.beginPath();
        overlayCtx.moveTo(xFin - 2, e.yZona); overlayCtx.lineTo(xFin - 6, e.y);
        overlayCtx.stroke();
      }
      overlayCtx.fillStyle = e.color;
      overlayCtx.beginPath();
      if (overlayCtx.roundRect) overlayCtx.roundRect(bx, e.y - altoEt / 2, anchoTxt, altoEt, 4);
      else overlayCtx.rect(bx, e.y - altoEt / 2, anchoTxt, altoEt);
      overlayCtx.fill();
      overlayCtx.fillStyle = "#0b0e14";
      overlayCtx.textAlign = "left";
      overlayCtx.fillText(e.texto, bx + 7, e.y + 0.5);
    });
    overlayCtx.restore();
  }

  // Veredicto corto de cada zona: una palabra de nivel (por la fuerza) +
  // etiquetas breves. Los rebotes pasados NO suben el nivel: la zona se
  // dibuja justo donde el precio ya giró, así que siempre salen altos. Los
  // CRUCES sí informan: si pese a ese sesgo el precio la atravesó casi tantas
  // veces como rebotó, la zona es porosa y se baja un nivel.
  function veredictoSRF(z, enCongestion) {
    const visitas = z.rechazos + z.cruces;
    // Porosa: muchos cruces con suficientes visitas, o solo cruces sin ningún rebote.
    const muyCruzada = (visitas >= 6 && z.cruces >= 0.75 * z.rechazos) || (z.rechazos === 0 && z.cruces >= 2);
    const niveles = ["moderado", "fuerte", "muy fuerte"];
    const colores = ["#d9a441", "#26a69a", "#00e676"];
    let n = z.fuerza >= 80 ? 2 : z.fuerza >= 60 ? 1 : 0;
    if (muyCruzada) n = Math.max(0, n - 1);
    if (visitas >= 6 && z.cruces > z.rechazos) n = 0;   // más cruces que rebotes: pese al sesgo a favor, la cruzan más de lo que la respetan

    let texto, color;
    if (z.tipo === "Z") { texto = "Adentro: esperar cierre"; color = "#ffb300"; }
    else { texto = `${z.tipo === "R" ? "Techo" : "Piso"} ${niveles[n]}`; color = colores[n]; }

    const tags = [];
    if (z.tipo !== "Z" && z.distAtr <= 1) tags.push("cerca");
    const ev = z.ultimoEvento;
    if (ev && ev.tipo === "cruce" && ev.hace <= 20) tags.push(`rota hace ${ev.hace}`);
    if (visitas === 0) tags.push("sin probar");
    if (muyCruzada) tags.push("muy cruzada");
    if (enCongestion) tags.push("congestión");
    if (z.polaridad) tags.push("⇅");
    if (z.ultimoToqueHace > 150) tags.push("antigua");
    return { texto, color, tags };
  }

  function renderizarTablaSRF() {
    if (!mostrarSRF) { srfBoardEl.classList.remove("show"); return; }
    srfBoardEl.classList.add("show");
    srfBoardEl.classList.toggle("min", srfTablaMin);

    const zonas = currentSRF ? currentSRF.zones.slice().sort((a, b) => b.mid - a.mid) : [];
    // Congestión: zonas vecinas separadas por menos de 1 ATR forman en la
    // práctica una sola franja ancha donde el precio se mueve de lado.
    const congestion = new Set();
    for (let i = 1; i < zonas.length; i++) {
      if (zonas[i - 1].bottom - zonas[i].top <= 1.0 * currentSRF.atr) { congestion.add(zonas[i - 1]); congestion.add(zonas[i]); }
    }
    let cuerpo;
    if (!zonas.length) {
      cuerpo = `<div class="srf-empty">Sin zonas claras en las velas cargadas.<br>Prueba "Cargar más historial".</div>`;
    } else {
      let filas = "", precioPuesto = false;
      const filaPrecio = () => `<tr class="srf-precio"><td colspan="6">── Último cierre ${fmtPrecioSRF(currentSRF.close)} ──</td></tr>`;
      zonas.forEach((z, i) => {
        if (!precioPuesto && (z.tipo === "S" || z.tipo === "Z")) {
          if (z.tipo === "S") filas += filaPrecio();
          precioPuesto = true;
        }
        const color = SRF_COLORES[z.tipo];
        const v = veredictoSRF(z, congestion.has(z));
        const ev = z.ultimoEvento;
        const detalle = `${z.etiqueta}: ${fmtPrecioSRF(z.bottom)} – ${fmtPrecioSRF(z.top)}\n` +
          `Fuerza ${Math.round(z.fuerza)} (${z.clase}) · ${z.nFractales} fractales (${z.nAltos} máx., ${z.nBajos} mín.)\n` +
          `Reacciones: ${z.rechazos} rebotes, ${z.cruces} cruces` +
          (z.visitaEnCurso ? " · visita en curso" : "") +
          (ev ? `\nÚltimo evento: ${ev.tipo} hace ${ev.hace} velas` : "") +
          `\nÚltimo toque: hace ${z.ultimoToqueHace} velas`;
        filas += `
          <tr class="srf-zona" data-i="${i}" title="${detalle}">
            <td><span class="srf-tag" style="background:${hexToRgba(color, 0.18)};color:${color}">${z.etiqueta === "EN ZONA" ? "ZONA" : z.etiqueta}</span></td>
            <td>${fmtPrecioSRF(z.mid)}</td>
            <td style="color:#848e9c">${z.tipo === "Z" ? "adentro" : z.distAtr.toFixed(1)}</td>
            <td><span class="srf-bar"><i style="width:${Math.round(z.fuerza)}%;background:${color}"></i></span><b>${Math.round(z.fuerza)}</b></td>
            <td><span style="color:#26a69a">${z.rechazos}↩</span> <span style="color:#ef5350">${z.cruces}✕</span></td>
            <td class="srf-lect"><span class="srf-dot" style="background:${v.color}"></span>${v.texto}${
              v.tags.length ? `<div class="srf-tags">${v.tags.map(t => `<span>${t}</span>`).join("")}</div>` : ""}</td>
          </tr>`;
      });
      if (!precioPuesto) filas += filaPrecio();
      cuerpo = `<table>
        <thead><tr><th>Zona</th><th>Precio</th><th title="Distancia al precio en ATR">Dist.</th><th>Fuerza</th><th title="Veces que el precio rebotó (↩) o la cruzó (✕) desde que existe la zona">Reacciones</th><th>Lectura</th></tr></thead>
        <tbody>${filas}</tbody></table>`;
    }

    srfBoardEl.innerHTML = `
      <div class="srf-head">ZONAS S/R FRACTAL
        <span class="srf-sub">${currentSRF ? `ATR ${fmtPrecioSRF(currentSRF.atr)}` : ""}</span>
        <button type="button" class="srf-btn srf-btn-guia" title="Cómo leer esta tabla">?</button>
        <button type="button" class="srf-btn srf-btn-min" title="Minimizar / expandir">${srfTablaMin ? "+" : "−"}</button>
      </div>
      <div class="srf-body">${cuerpo}</div>
      <div class="srf-guia ${srfGuiaVisible ? "show" : ""}">
        <b>Techo</b> = resistencia · <b>Piso</b> = soporte · <b>ZONA</b> = el precio está adentro.<br>
        <b>Dist.</b>: qué tan lejos está, en ATR (1 ATR ≈ movimiento de una vela normal).<br>
        <b>Fuerza</b>: cuántos fractales importantes coinciden en ese precio, más si fue techo y piso (0-100).<br>
        <b>Reacciones</b>: rebotes ↩ y cruces ✕ desde que existe la zona. Es contexto, no probabilidad: la zona se dibuja donde el precio ya giró, por eso los rebotes siempre salen altos.<br>
        <b>⇅</b> fue techo y piso · <b>rota hace N</b> el precio la cruzó hace N velas.<br>
        <b>muy cruzada</b>: casi tantos cruces como rebotes, o solo cruces; zona porosa (baja un nivel; si tiene más cruces que rebotes queda en moderado) · <b>sin probar</b>: el precio aún no la visitó · <b>congestión</b>: pegada a otra zona, se comportan como una sola franja de lateral.<br>
        Pasa el mouse por una fila para ver su zona y el detalle. Es una guía de estructura, no una señal de entrada.
      </div>`;

    srfBoardEl.querySelector(".srf-btn-min").onclick = () => {
      srfTablaMin = !srfTablaMin; guardarLS("srf_tabla_min", srfTablaMin); renderizarTablaSRF();
    };
    srfBoardEl.querySelector(".srf-btn-guia").onclick = () => {
      srfGuiaVisible = !srfGuiaVisible; guardarLS("srf_tabla_guia", srfGuiaVisible);
      if (srfGuiaVisible && srfTablaMin) { srfTablaMin = false; guardarLS("srf_tabla_min", false); }
      renderizarTablaSRF();
    };
    srfBoardEl.querySelectorAll("tr.srf-zona").forEach(tr => {
      const z = zonas[+tr.dataset.i];
      tr.addEventListener("mouseenter", () => { srfResaltada = z; tr.classList.add("activa"); requestAnimationFrame(redrawOverlay); });
      tr.addEventListener("mouseleave", () => { srfResaltada = null; tr.classList.remove("activa"); requestAnimationFrame(redrawOverlay); });
    });
  }

  function actualizarChipSRF() {
    renderizarTablaSRF();
    if (!mostrarSRF || !currentSRF || !currentSRF.zones.length) {
      sigSrf.textContent = mostrarSRF ? "S/R Fractal: sin zonas" : "";
      sigSrf.style.display = mostrarSRF ? "" : "none";
      return;
    }
    sigSrf.style.display = "";
    const z = currentSRF.zones;
    const dentro = z.find(x => x.tipo === "Z");
    const r1 = z.find(x => x.etiqueta === "R1"), s1 = z.find(x => x.etiqueta === "S1");
    const parte = (x, n) => x ? `${n} ${fmtPrecioSRF(x.mid)} (${Math.round(x.fuerza)}, a ${x.distAtr.toFixed(1)} ATR)` : `${n} —`;
    sigSrf.textContent = dentro
      ? `S/R Fractal: ⚠ precio EN ZONA ${fmtPrecioSRF(dentro.bottom)}–${fmtPrecioSRF(dentro.top)} (${Math.round(dentro.fuerza)})`
      : `S/R Fractal: ${parte(r1, "R1")} · ${parte(s1, "S1")}`;
    sigSrf.title = "Fuerza 0-100 = densidad de fractales importantes (80%) + cambio de rol R↔S (20%). " +
                   "Es importancia estructural, no probabilidad de dirección.";
  }

  // ══════════════════════════════════════════════════════════
  // SECUENCIA ESTRUCTURAL
  //   FRACTAL → RUPTURA → DESPLAZAMIENTO → IMBALANCE → RETESTEO → CONTINUACIÓN
  //
  // El motor (secuencia_fractal.js) es puro y está probado aparte; acá
  // solo se calcula sobre las velas ya cargadas, se dibuja y se explica.
  // Regla de oro: NO hay señal por tener un fractal. La señal es la
  // secuencia completa, y el score dice cuánto de ella se cumplió.
  // ══════════════════════════════════════════════════════════
  function calcularSecuencia(candles) {
    if (!window.SecuenciaFractal) return null;
    try { return window.SecuenciaFractal.calcular(candles, { symbol: symbolActual, timeframe: timeframeActual }); }
    catch (e) { console.error("Secuencia estructural:", e); return null; }
  }

  function fmtPrecioSEQ(v) {
    const a = currentSEQ && currentSEQ.close ? Math.abs(currentSEQ.close) : Math.abs(v);
    return v.toFixed(a >= 1000 ? 2 : a >= 20 ? 3 : 5);
  }

  const SEQ_COL = {
    alcista: "#26a69a", bajista: "#ef5350",
    muerta: "#5d606b", aviso: "#ffb300", ok: "#00e676",
  };
  const colorDe = s => (s.estado === "INVALIDADO" ? SEQ_COL.muerta
                        : s.dir > 0 ? SEQ_COL.alcista : SEQ_COL.bajista);

  // Las 6 etapas, tal cual el orden del pliego. `estado` de cada una:
  // "ok" cumplida, "curso" es la que se está esperando, "no" pendiente.
  function etapasDe(s) {
    const d = s.dir > 0;
    const pasos = [
      { nom: "Fractal", hecho: !!s.fractal,
        det: s.fractal ? `${d ? "máx." : "mín."} ${fmtPrecioSEQ(s.fractal.price)}` : "" },
      { nom: "Ruptura", hecho: !!s.ruptura,
        det: s.ruptura ? `cierre ${d ? ">" : "<"} ${fmtPrecioSEQ(s.ruptura.nivel)}` : "" },
      { nom: "Desplazamiento", hecho: !!s.desplazamiento,
        det: s.desplazamiento ? `cuerpo x${s.desplazamiento.cuerpoRel.toFixed(1)} · ${s.desplazamiento.rangoAtr.toFixed(1)} ATR` : "" },
      { nom: "Imbalance", hecho: !!s.imbalance,
        det: s.imbalance ? `${fmtPrecioSEQ(s.imbalance.bottom)}–${fmtPrecioSEQ(s.imbalance.top)} · ${s.imbalance.estado.toLowerCase()}` : "" },
      { nom: "Retesteo", hecho: !!s.retest,
        det: s.retest ? `${s.retest.tipo} · ${Math.round(s.retest.pct * 100)}% recorrido` : "" },
      { nom: "Continuación", hecho: !!s.continuacion,
        det: s.continuacion ? s.continuacion.tipo : "" },
    ];
    const primeraPendiente = pasos.findIndex(p => !p.hecho);
    pasos.forEach((p, i) => {
      p.estado = p.hecho ? "ok" : (i === primeraPendiente && !s.cerrado ? "curso" : "no");
      if (p.estado === "curso") p.det = "pendiente";
    });
    return pasos;
  }

  function colorScore(sc) {
    return sc >= 80 ? SEQ_COL.ok : sc >= 60 ? SEQ_COL.alcista : sc >= 40 ? SEQ_COL.aviso : "#848e9c";
  }

  // ── Dibujo sobre el canvas: zona del imbalance, nivel roto y retesteo ──
  function dibujarSecuencia(w) {
    if (!mostrarSEQ || !currentSEQ) return;
    const ts = chart.timeScale();
    let anchoEscala = 0;
    try { anchoEscala = chart.priceScale("right").width() || 0; } catch (e) { anchoEscala = 0; }
    const xFin = w - anchoEscala;

    currentSEQ.visibles.forEach(s => {
      const z = s.imbalance;
      const col = colorDe(s);
      const viva = s.estado !== "INVALIDADO";

      // ── nivel del fractal roto: dónde empezó todo ──
      if (seqCapas.ruptura && s.ruptura) {
        const yN = candleSerie.priceToCoordinate(s.ruptura.nivel);
        let xa = ts.timeToCoordinate(s.fractal.time);
        let xb = ts.timeToCoordinate(s.ruptura.time);
        if (yN !== null && xa !== null && xb !== null) {
          overlayCtx.save();
          overlayCtx.strokeStyle = hexToRgba(col, viva ? 0.75 : 0.35);
          overlayCtx.lineWidth = 1;
          overlayCtx.setLineDash([3, 3]);
          overlayCtx.beginPath();
          overlayCtx.moveTo(Math.max(0, xa), yN);
          overlayCtx.lineTo(Math.min(xFin, xb), yN);
          overlayCtx.stroke();
          overlayCtx.restore();
        }
      }

      // ── zona del imbalance (FVG) ──
      if (seqCapas.imbalance) {
        const yTop = candleSerie.priceToCoordinate(z.top);
        const yBot = candleSerie.priceToCoordinate(z.bottom);
        let x0 = ts.timeToCoordinate(z.time);
        if (yTop !== null && yBot !== null && x0 !== null) {
          x0 = Math.max(0, x0);
          // Una zona invalidada o mitigada deja de proyectarse: se corta
          // donde dejó de servir, para no ensuciar el gráfico a la derecha.
          let x1 = xFin;
          if (s.cierreTime) {
            const xc = ts.timeToCoordinate(s.cierreTime);
            if (xc !== null) x1 = Math.min(xFin, Math.max(x0 + 2, xc));
          }
          if (x0 < xFin) {
            const y1 = Math.min(yTop, yBot), alto = Math.max(2, Math.abs(yBot - yTop));
            overlayCtx.save();
            // Relleno según el estado de la zona: llena = activa,
            // apenas visible = ya mitigada, vacía y punteada = invalidada.
            const alfa = z.estado === "ACTIVO" ? 0.22
                       : z.estado === "RETESTEADO" ? 0.16
                       : z.estado === "MITIGADO" ? 0.07 : 0;
            if (alfa > 0) { overlayCtx.fillStyle = hexToRgba(col, alfa); overlayCtx.fillRect(x0, y1, x1 - x0, alto); }
            overlayCtx.strokeStyle = hexToRgba(col, viva ? 0.9 : 0.4);
            overlayCtx.lineWidth = viva ? 1.2 : 1;
            if (!viva) overlayCtx.setLineDash([4, 4]);
            overlayCtx.strokeRect(x0, y1, x1 - x0, alto);
            overlayCtx.restore();

            // ── retesteo: marca en el borde por donde volvió el precio ──
            if (seqCapas.retest && s.retest) {
              const xr = ts.timeToCoordinate(s.retest.time);
              const yr = candleSerie.priceToCoordinate(s.dir > 0 ? z.top : z.bottom);
              if (xr !== null && yr !== null) {
                overlayCtx.save();
                overlayCtx.fillStyle = hexToRgba(col, 0.95);
                overlayCtx.beginPath();
                overlayCtx.arc(xr, yr, 3.5, 0, Math.PI * 2);
                overlayCtx.fill();
                overlayCtx.restore();
              }
            }

            // ── etiqueta: dirección, score y etapa alcanzada ──
            if (seqCapas.etiqueta) {
              const txt = `${s.dir > 0 ? "COMPRA" : "VENTA"} ${s.score} · ${
                s.estado === "INVALIDADO" ? "invalidada" : s.estado.toLowerCase()}`;
              overlayCtx.save();
              overlayCtx.font = "bold 10px 'Segoe UI', sans-serif";
              overlayCtx.textBaseline = "middle";
              const ancho = overlayCtx.measureText(txt).width + 12;
              const bx = Math.min(x0 + 2, xFin - ancho - 4);
              const by = s.dir > 0 ? y1 + alto + 9 : y1 - 9;
              overlayCtx.fillStyle = hexToRgba(col, viva ? 0.92 : 0.5);
              overlayCtx.beginPath();
              if (overlayCtx.roundRect) overlayCtx.roundRect(bx, by - 8, ancho, 16, 3);
              else overlayCtx.rect(bx, by - 8, ancho, 16);
              overlayCtx.fill();
              overlayCtx.fillStyle = "#0b0e14";
              overlayCtx.textAlign = "left";
              overlayCtx.fillText(txt, bx + 6, by + 0.5);
              overlayCtx.restore();
            }
          }
        }
      }
    });
  }

  // Una sola estructura = una línea: etiqueta, 6 puntos de avance y UNA frase que dice
  // qué falta. El detalle de cada etapa (niveles, %, score) queda en el tooltip;
  // las capas, alertas y estadísticas viven bajo "más".
  function fraseSEQ(s, dir, pasos) {
    const d = dir > 0;
    const velasDesde = s.cerrado && s.cierreIdx != null && currentSEQ ? currentSEQ.lastIdx - s.cierreIdx : null;
    const hace = velasDesde === null ? ""
      : velasDesde === 0 ? " en la última vela"
      : velasDesde === 1 ? " hace 1 vela" : ` hace ${velasDesde} velas`;
    if (s.estado === "INVALIDADO") return { txt: `Invalidada${hace}`, col: SEQ_COL.muerta, vieja: velasDesde > 5 };
    if (s.estado === "COMPLETED") return { txt: `Completada${hace}`, col: SEQ_COL.ok, vieja: velasDesde > 5 };
    // En CONFIRMATION la continuación ya cuenta en el score, pero todavía falta
    // el nuevo extremo que completa la secuencia: ahí está lo que se espera.
    const falta = s.estado === "CONFIRMATION" ? "Continuación"
      : (pasos.find(p => p.estado === "curso") || {}).nom;
    const z = s.imbalance ? `${fmtPrecioSEQ(s.imbalance.bottom)}–${fmtPrecioSEQ(s.imbalance.top)}` : "";
    let txt;
    if (falta === "Continuación" && s.extremoRef != null)
      txt = `Falta ${d ? "nuevo máximo sobre" : "nuevo mínimo bajo"} ${fmtPrecioSEQ(s.extremoRef)}`;
    else if (falta === "Retesteo") txt = `Falta retesteo${z ? ": vuelta a " + z : ""}`;
    else if (falta === "Desplazamiento") txt = "Falta un movimiento fuerte";
    else if (falta === "Imbalance") txt = "Falta el hueco (imbalance)";
    else if (falta === "Ruptura") txt = "Falta la ruptura";
    else txt = "En formación";
    return { txt, col: SEQ_COL.aviso, vieja: false };
  }

  function bloqueSEQ(s, dir) {
    const d = dir > 0;
    const colDir = d ? SEQ_COL.alcista : SEQ_COL.bajista;
    const badge = (col, txt) =>
      `<span class="seq-badge" style="background:${hexToRgba(col, 0.18)};color:${col}">${txt}</span>`;
    const nombre = d ? "▲ ALCISTA" : "▼ BAJISTA";
    if (!s) {
      return `<div class="seq-blq"><div class="seq-dir">${badge(colDir, nombre)}
        <span class="seq-vacio">sin estructura en curso</span></div></div>`;
    }
    const pasos = etapasDe(s);
    const f = fraseSEQ(s, dir, pasos);
    if (s.estado === "CONFIRMATION") pasos[5].estado = "curso";   // la última aún no se completa
    const puntos = pasos.map(p =>
      `<i class="seq-pt ${p.estado}" title="${p.nom}${p.det ? ": " + p.det : ""}"></i>`).join("");
    return `
      <div class="seq-blq${f.vieja ? " seq-cerrada" : ""}" title="Puntaje ${s.score}/100 (confluencia, no probabilidad)">
        <div class="seq-dir">${badge(colorDe(s), nombre)}<span class="seq-puntos">${puntos}</span></div>
        <div class="seq-frase" style="color:${f.col}">${f.txt}</div>
      </div>`;
  }

  // ── Panel 13: una línea por sentido; lo demás, bajo "más" ──
  function renderizarPanelSEQ() {
    if (!mostrarSEQ) { seqPanelEl.classList.remove("show"); return; }
    seqPanelEl.classList.add("show");
    seqPanelEl.classList.toggle("min", seqPanelMin);

    // Una sola estructura a la vez (dos a la vez confundían): la viva más
    // avanzada de cualquier sentido; si no hay viva, la cerrada más reciente.
    let unica = null;
    if (currentSEQ) {
      const ord = window.SecuenciaFractal.ORDEN_ESTADOS;
      const cands = [currentSEQ.mejorAlcista, currentSEQ.mejorBajista].filter(Boolean);
      const vivas = cands.filter(s => !s.cerrado);
      unica = vivas.length
        ? vivas.reduce((a, b) => (ord.indexOf(b.estado) > ord.indexOf(a.estado) ? b : a))
        : cands.reduce((a, b) => (!a || b.cierreIdx > a.cierreIdx ? b : a), null);
    }
    const cuerpo = !unica
      ? `<div class="seq-empty">Sin estructura en curso.<br>Prueba "Cargar más historial".</div>`
      : `<div class="seq-body">${bloqueSEQ(unica, unica.dir)}</div>`;

    let masHTML = "";
    if (seqMasVisible) {
      const capaBtn = (k, txt) => `<button type="button" data-capa="${k}" class="${seqCapas[k] ? "on" : ""}">${txt}</button>`;
      const alertaBtn = (k, txt) => `<button type="button" data-alerta="${k}" class="${seqAlertas[k] ? "on" : ""}">${txt}</button>`;
      let stats = "";
      if (currentSEQ) {
        const st = currentSEQ.stats;
        const num = v => (v == null ? "—" : Math.round(v));
        stats = `<div class="seq-stats">En estas velas: <b>${st.imbalances}</b> imbalances ·
          <b>${num(st.pctRetest)}%</b> retesteados · <b>${num(st.pctContinuacion)}%</b> continuaron
          (muestra chica: úsalo para comprobar, no para suponer).</div>`;
      }
      const sc = s => (s ? `${s.score}/100` : "—");
      masHTML = `
        <div class="seq-stats">Puntaje: <b>${sc(unica)}</b>
          (cuántas etapas se cumplieron; no es probabilidad de acierto).</div>
        ${stats}
        <div class="seq-capas">
          ${capaBtn("imbalance", "zona")}${capaBtn("ruptura", "ruptura")}${capaBtn("retest", "retest")}
          ${capaBtn("fractales", "fractales")}${capaBtn("flechas", "flechas")}${capaBtn("etiqueta", "etiqueta")}
        </div>
        <div class="seq-capas" style="border-top-color:#1a1e29">
          ${alertaBtn("activas", "🔔 alertas")}${alertaBtn("sonido", "sonido")}
          ${alertaBtn("ruptura", "ruptura")}${alertaBtn("imbalance", "imbalance")}
          ${alertaBtn("retest", "retest")}${alertaBtn("completo", "completa")}
        </div>`;
    }

    seqPanelEl.innerHTML = `
      <div class="seq-head">ESTRUCTURAS
        <button type="button" class="seq-btn seq-btn-guia" title="Cómo leer este panel">?</button>
        <button type="button" class="seq-btn seq-btn-min" title="Minimizar / expandir">${seqPanelMin ? "+" : "−"}</button>
      </div>
      ${cuerpo}
      <div class="seq-masfila"><button type="button" class="seq-mas">${seqMasVisible ? "menos ▴" : "más ▾"}</button></div>
      ${masHTML}
      <div class="seq-guia ${seqGuiaVisible ? "show" : ""}">
        Los 6 puntos son las etapas en orden: fractal, ruptura, movimiento fuerte, hueco
        (imbalance), retesteo y continuación. <b>●</b> hecha · <b style="color:#ffb300">●</b> la que falta ·
        <b>○</b> pendiente. Pasa el mouse por un punto para ver su detalle.<br>
        Se muestra la <b>estructura más avanzada</b> en curso (alcista o bajista). Una cerrada hace tiempo se ve apagada.<br>
        Completar la secuencia es confluencia, <b>no una promesa de que el precio continúe</b>.
      </div>`;

    seqPanelEl.querySelector(".seq-btn-min").onclick = () => {
      seqPanelMin = !seqPanelMin; guardarLS("seq_panel_min", seqPanelMin); renderizarPanelSEQ();
    };
    seqPanelEl.querySelector(".seq-mas").onclick = () => {
      seqMasVisible = !seqMasVisible; guardarLS("seq_panel_mas", seqMasVisible); renderizarPanelSEQ();
    };
    seqPanelEl.querySelector(".seq-btn-guia").onclick = () => {
      seqGuiaVisible = !seqGuiaVisible; guardarLS("seq_panel_guia", seqGuiaVisible);
      if (seqGuiaVisible && seqPanelMin) { seqPanelMin = false; guardarLS("seq_panel_min", false); }
      renderizarPanelSEQ();
    };
    seqPanelEl.querySelectorAll("[data-capa]").forEach(b => {
      b.onclick = () => {
        const k = b.dataset.capa;
        seqCapas[k] = !seqCapas[k];
        guardarLS("seq_capa_" + k, seqCapas[k]);
        renderizarPanelSEQ();
        dibujarKalmanYMarkers();
        requestAnimationFrame(redrawOverlay);
      };
    });
    seqPanelEl.querySelectorAll("[data-alerta]").forEach(b => {
      b.onclick = () => {
        const k = b.dataset.alerta;
        seqAlertas[k] = !seqAlertas[k];
        guardarLS("seq_alerta_" + (k === "activas" ? "on" : k), seqAlertas[k]);
        if (k === "activas" && seqAlertas.activas && "Notification" in window
            && Notification.permission === "default") {
          Notification.requestPermission().catch(() => {});
        }
        renderizarPanelSEQ();
      };
    });
  }

  function actualizarChipSEQ() {
    renderizarPanelSEQ();
    if (!mostrarSEQ || !currentSEQ || !currentSEQ.actual) {
      sigSeq.textContent = mostrarSEQ ? "Secuencia: —" : "";
      sigSeq.style.display = mostrarSEQ ? "" : "none";
      return;
    }
    sigSeq.style.display = "";
    const s = currentSEQ.actual;
    const etapa = s.estado === "INVALIDADO" ? `invalidada en ${String(s.estadoAlCerrar || "").toLowerCase()}` : s.estado.toLowerCase();
    sigSeq.textContent = `Secuencia: ${s.dir > 0 ? "compra" : "venta"} ${s.score}/100 · ${etapa}`;
    sigSeq.className = "sig-seq chip " + (s.estado === "INVALIDADO" ? "chip-wait" : s.dir > 0 ? "chip-buy" : "chip-sell");
    sigSeq.title = "Score = suma de las etapas cumplidas de la secuencia. Es confluencia " +
                   "estructural, no probabilidad de acierto.";
  }

  // ── 12) Alertas: solo eventos CONFIRMADOS, y cada uno una sola vez ──
  function pitido() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ac = new Ctx(), osc = ac.createOscillator(), g = ac.createGain();
      osc.frequency.value = 880; g.gain.value = 0.05;
      osc.connect(g); g.connect(ac.destination);
      osc.start(); osc.stop(ac.currentTime + 0.12);
      setTimeout(() => ac.close().catch(() => {}), 400);
    } catch (e) { /* el sonido es opcional, nunca debe romper nada */ }
  }

  const SEQ_ALERTA_DE = {           // evento del motor -> interruptor del panel
    fractal: "fractal", ruptura: "ruptura", desplazamiento: "ruptura",
    imbalance: "imbalance", retest: "retest",
    confirmacion: "completo", completado: "completo",
  };

  function revisarAlertasSEQ(esPrimeraCarga) {
    if (!currentSEQ) return;
    const ids = currentSEQ.eventos.map(e => `${e.setupId}:${e.tipo}:${e.idx}`);
    // En la primera carga (o al cambiar de símbolo) todo lo que ya pasó se
    // marca como visto: las alertas son para lo que ocurre de ahora en más.
    if (esPrimeraCarga) { seqEventosVistos = new Set(ids); return; }
    if (!mostrarSEQ || !seqAlertas.activas) { ids.forEach(id => seqEventosVistos.add(id)); return; }

    const nuevos = [];
    currentSEQ.eventos.forEach((e, i) => {
      const id = ids[i];
      if (seqEventosVistos.has(id)) return;
      seqEventosVistos.add(id);
      if (e.tipo === "invalidacion") return;                    // no se alerta el descarte
      const llave = SEQ_ALERTA_DE[e.tipo];
      if (llave && seqAlertas[llave]) nuevos.push(e);
    });
    if (!nuevos.length) return;

    const e = nuevos[nuevos.length - 1];
    const txt = `${symbolActual || ""} ${timeframeActual || ""} · ${
      e.dir > 0 ? "compra" : "venta"} · ${e.tipo} · score ${e.score}/100`;
    setEstado("🔔 " + txt, "ok");
    if (seqAlertas.sonido) pitido();
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Secuencia estructural", { body: txt });
      }
    } catch (err) { /* notificación opcional */ }
  }

  function redrawOverlay() {
    if (!overlayCtx) return;
    const w = overlayCanvas.clientWidth, h = overlayCanvas.clientHeight;
    overlayCtx.clearRect(0, 0, w, h);

    // Con el futuro crudo visible, lo que dibujan los indicadores (rellenos,
    // zonas, banderas…) se corta en la última vela analizada.
    overlayCtx.save();
    if (limiteDerecha !== null) {
      const xCorte = chart.timeScale().timeToCoordinate(limiteDerecha);
      if (xCorte !== null) {
        overlayCtx.beginPath();
        overlayCtx.rect(0, 0, xCorte + 1, h);
        overlayCtx.clip();
      }
    }

    currentChannels
      .filter(ch => filtroCanales[grupoDeCanal(ch.label)])
      .forEach(ch => {
        const baseCoords = ch.base_points
          .map(p => [chart.timeScale().timeToCoordinate(p.t), candleSerie.priceToCoordinate(p.y)])
          .filter(([x, y]) => x !== null && y !== null);
        const parCoords = ch.par_points
          .map(p => [chart.timeScale().timeToCoordinate(p.t), candleSerie.priceToCoordinate(p.y)])
          .filter(([x, y]) => x !== null && y !== null);

        if (mostrarRelleno && baseCoords.length >= 2 && parCoords.length >= 2) {
          overlayCtx.beginPath();
          overlayCtx.moveTo(baseCoords[0][0], baseCoords[0][1]);
          for (let i = 1; i < baseCoords.length; i++) overlayCtx.lineTo(baseCoords[i][0], baseCoords[i][1]);
          for (let i = parCoords.length - 1; i >= 0; i--) overlayCtx.lineTo(parCoords[i][0], parCoords[i][1]);
          overlayCtx.closePath();
          overlayCtx.fillStyle = hexToRgba(ch.color, 0.12);
          overlayCtx.fill();
        }
      });

    dibujarZonasSRF(w);
    dibujarSecuencia(w);

    if (mostrarKN && currentKN) {
      const k = currentKN;
      const xStart = chart.timeScale().timeToCoordinate(k.signalTime);
      const xEndRaw = chart.timeScale().timeToCoordinate(k.lineEndTime);
      const yEntry = candleSerie.priceToCoordinate(k.entry);
      const ySl = candleSerie.priceToCoordinate(k.sl);
      const yTp1 = candleSerie.priceToCoordinate(k.tp1);
      const yTp2 = candleSerie.priceToCoordinate(k.tp2);
      const yTp3 = candleSerie.priceToCoordinate(k.tp3);
      if (xStart !== null && yEntry !== null && ySl !== null && yTp3 !== null) {
        const xEnd = xEndRaw !== null ? xEndRaw : w;
        overlayCtx.fillStyle = "rgba(38,166,154,0.10)"; // zona ganancia (entry -> tp3)
        overlayCtx.fillRect(xStart, Math.min(yEntry, yTp3), xEnd - xStart, Math.abs(yTp3 - yEntry));
        overlayCtx.fillStyle = "rgba(239,83,80,0.10)"; // zona pérdida (entry -> sl)
        overlayCtx.fillRect(xStart, Math.min(yEntry, ySl), xEnd - xStart, Math.abs(ySl - yEntry));

        // ── Banderas con el valor de cada nivel, pegadas al final de la
        // línea (estilo TradingView) en vez de solo verse en el eje derecho.
        const fmtFlag = v => v.toFixed(5);
        const hitColorFlag = "#26a69a";
        const slColorFlag = "#ff9800";
        const slHitColorFlag = "#ef5350";
        const tpColorFlag = "#29b6f6";
        const xFlag = Math.min(xEnd, w - 4);

        dibujarBanderaKN(xFlag, yEntry, `ENTRY ${fmtFlag(k.entry)}`, "#9aa0a6");
        dibujarBanderaKN(xFlag, ySl, k.slHit ? "SL ✕" : `SL ${fmtFlag(k.sl)}`, k.slHit ? slHitColorFlag : slColorFlag);
        if (yTp1 !== null) dibujarBanderaKN(xFlag, yTp1, k.tp1Hit ? "TP1 ✓" : `TP1 ${fmtFlag(k.tp1)}`, k.tp1Hit ? hitColorFlag : tpColorFlag);
        if (yTp2 !== null) dibujarBanderaKN(xFlag, yTp2, k.tp2Hit ? "TP2 ✓" : `TP2 ${fmtFlag(k.tp2)}`, k.tp2Hit ? hitColorFlag : tpColorFlag);
        dibujarBanderaKN(xFlag, yTp3, k.tp3Hit ? "TP3 ✓" : `TP3 ${fmtFlag(k.tp3)}`, k.tp3Hit ? hitColorFlag : tpColorFlag);
      }
    }

    // Banderas de precio (R1/S1/...) del indicador S/R Avanzado — comentadas
    // por pedido explícito (por ahora no se necesitan). Las líneas de los
    // niveles se siguen dibujando igual (ver dibujarSR()); esto solo apaga
    // las etiquetas con el precio. Para reactivarlas, poner esta bandera en
    // true de nuevo.
    const SR_MOSTRAR_BANDERAS = false;
    if (SR_MOSTRAR_BANDERAS && mostrarSR && currentSR) {
      const resFlagColor = "#ef5350", supFlagColor = "#26a69a";
      const rsFlagColor = "#26a69a", srFlagColor = "#ef5350";
      const drawLevelFlag = (level, color) => {
        const x = chart.timeScale().timeToCoordinate(level.endTime);
        const y = candleSerie.priceToCoordinate(level.price);
        if (x === null || y === null) return;
        dibujarBanderaKN(Math.min(x, w - 4), y, level.label, color);
      };
      currentSR.resistances.filter(l => l.valid).forEach(l => drawLevelFlag(l, resFlagColor));
      currentSR.supports.filter(l => l.valid).forEach(l => drawLevelFlag(l, supFlagColor));
      currentSR.flips.forEach(f => drawLevelFlag(f, f.isSupport ? rsFlagColor : srFlagColor));
    }

    overlayCtx.restore();   // fin del recorte de indicadores

    if (lastRealTime !== null) {
      const xNow = chart.timeScale().timeToCoordinate(lastRealTime);
      if (xNow !== null) {
        overlayCtx.save();
        overlayCtx.setLineDash([2, 3]);
        overlayCtx.strokeStyle = "rgba(120, 123, 134, 0.6)";
        overlayCtx.lineWidth = 1;
        overlayCtx.beginPath();
        overlayCtx.moveTo(xNow, 0);
        overlayCtx.lineTo(xNow, h);
        overlayCtx.stroke();
        overlayCtx.restore();
      }
    }

    dibujarAnotaciones(w);
  }

  function renderizarSenales(sig, channels) {
    const label = sig.confirmed_signal || sig.signal || "Wait";
    sigSignal.textContent = `Señal: ${label}`;
    sigSignal.className = "chip " + (label.startsWith("Buy") ? "chip-buy" : label.startsWith("Sell") ? "chip-sell" : "chip-wait");

    const extra = sig.breakout ? ` · ${sig.breakout}` : (sig.react ? ` · ${sig.react}` : "");
    if (extra) sigSignal.textContent += extra;

    sigKalman.textContent = sig.kalman_trend ? `Kalman: ${sig.kalman_trend}${sig.kalman_flip ? " · " + sig.kalman_flip : ""}` : "";

    sigCanales.textContent = "Canales: " + (channels.length
      ? channels.map(c => `${c.label} ${Math.round(c.quality*100)}%`).join(" | ")
      : "—");
  }

  function renderizarSMF(smf, mantenerVista = false) {
    if (!smf) {
      smfContainer.style.display = "none";
      return;
    }
    smfContainer.style.display = "block";

    if (!smfChart) {
      smfChart = LightweightCharts.createChart(smfContainer, {
        width: smfContainer.clientWidth, height: smfContainer.clientHeight,
        layout: { background:{ type:"solid", color:"#131722" }, textColor:"#d1d4dc" },
        grid: { vertLines:{color:"#1e222d"}, horzLines:{color:"#1e222d"} },
        rightPriceScale: { borderColor:"#2a2e39" },
        timeScale: { borderColor:"#2a2e39", timeVisible:true, secondsVisible:false, visible:false },
      });
      smfHist = smfChart.addHistogramSeries({ priceLineVisible:false, lastValueVisible:false });
      smfLine = smfChart.addLineSeries({ color:"#ffffff", lineWidth:1, priceLineVisible:false, lastValueVisible:false });

      chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
        if (range) smfChart.timeScale().setVisibleLogicalRange(range);
      });
    } else {
      smfChart.applyOptions({ width: smfContainer.clientWidth, height: smfContainer.clientHeight });
    }

    smfHist.setData(smf.bars);
    smfLine.setData(smf.smoothed);

    // Mismo criterio que el gráfico principal: si se mantiene la vista
    // (replay / solo cambió la fecha), este panel se sincroniza con el
    // rango lógico que YA tiene el gráfico principal en vez de resetear
    // a fitContent() — si no, cada avance de replay hacía que el panel
    // de SMF "saltara" aunque el gráfico de velas se mantuviera fijo.
    const rangoActual = mantenerVista ? chart.timeScale().getVisibleLogicalRange() : null;
    if (rangoActual) {
      smfChart.timeScale().setVisibleLogicalRange(rangoActual);
    } else {
      smfChart.timeScale().fitContent();
    }
  }

  // Respaldo por si el bróker no informó "digits" para este símbolo:
  // infiere la precisión a ojo, a partir de la magnitud del precio —
  // igual que hace cualquier plataforma cuando tiene que adivinar.
  // Forex "directo" (EURUSD, NZDUSD...) cotiza por debajo de 20 y usa
  // 5 decimales; los cruces con yen (USDJPY, EURJPY...) cotizan sobre
  // 100+ y usan 3; lo demás (acciones, índices, cripto) se deja en 2.
  function inferirPrecisionPorPrecio(candles) {
    if (!candles || !candles.length) return 2;
    const precio = candles[candles.length - 1].close;
    if (precio > 0 && precio < 20) return 5;
    if (precio >= 20 && precio < 1000) return 3;
    return 2;
  }

  // ── Vista (zoom/paneo horizontal) ──
  // Se captura relativa a la ÚLTIMA vela (no con índices absolutos) para que
  // sobreviva a cambios en el tamaño de la ventana de velas, y se lee justo
  // antes de dibujar (no antes del fetch), así no se pisa lo que el usuario
  // hizo con el mouse mientras el servidor respondía.
  function capturarVista() {
    const rango = chart.timeScale().getVisibleLogicalRange();
    if (!rango || !loadedCandles.length) return null;
    const ultimo = loadedCandles.length - 1;
    return { desdeUltima: rango.from - ultimo, hastaUltima: rango.to - ultimo };
  }

  function restaurarVista(vista, nVelas) {
    const ultimo = nVelas - 1;
    chart.timeScale().setVisibleLogicalRange({
      from: ultimo + vista.desdeUltima,
      to:   ultimo + vista.hastaUltima,
    });
  }

  // ── Encuadre inicial al CARGAR ──
  // Cada carga "de verdad" (botón Cargar, Enter, cambio Online/Backtesting,
  // buscar fecha, clic + Enter, divisa/timeframe nuevos) deja la última vela
  // analizada justo en el centro de la pantalla. Conserva el ancho (zoom)
  // que ya tenía el usuario si es razonable; si no, usa un ancho por defecto.
  // Los pasos del reproductor NO usan esto: siguen restaurando la vista.
  const VISTA_ANCHO_DEFECTO = 160;   // velas visibles en total (mitad a cada lado)
  function centrarEnUltimaVela(nVelas, vista) {
    let ancho = vista ? (vista.hastaUltima - vista.desdeUltima) : VISTA_ANCHO_DEFECTO;
    if (!(ancho >= 20 && ancho <= 600)) ancho = VISTA_ANCHO_DEFECTO;
    const ultimo = nVelas - 1;
    chart.timeScale().setVisibleLogicalRange({
      from: ultimo - ancho / 2,
      to:   ultimo + ancho / 2,
    });
  }

  function renderizarTodo(data, opciones = {}) {
    // mantenerVista: true cuando el símbolo/timeframe no cambiaron respecto
    // a la carga anterior (ej. el reproductor de replay avanzando un paso,
    // o simplemente tocar la fecha con la misma divisa puesta) — en ese
    // caso no tiene sentido "resetear" el zoom/paneo que el usuario ya
    // armó a mano (por ejemplo para ver el gráfico junto a los tableros
    // de indicadores); se restaura el mismo rango visible de antes en vez
    // de hacer fitContent(). Si cambió la divisa o el timeframe, sigue
    // haciendo fitContent() como siempre, porque ahí sí es un gráfico
    // distinto y no hay nada previo que tenga sentido preservar.
    // centrar: la última vela analizada queda en el centro de la pantalla.
    // vistaPrevia: vista capturada por cargarDatos ANTES de vaciar las velas
    // posteriores (si se capturara después, el gráfico ya se habría corrido).
    const { mantenerVista = false, centrar = false, vistaPrevia = null } = opciones;

    // Se lee la vista AHORA (justo antes de reemplazar los datos), no antes
    // del fetch: si el usuario hizo zoom/paneo mientras cargaba, se respeta.
    const vista = mantenerVista ? (vistaPrevia || capturarVista()) : null;

    emptyScreen.style.display = "none";

    // Nuevo símbolo/timeframe cargado: los dibujos manuales (líneas, fibo,
    // trazos, texto) del gráfico anterior ya no tienen sentido en esta
    // nueva escala de tiempo/precio, así que se limpian. Si es el mismo
    // símbolo/timeframe (replay, o solo cambió la fecha) los dibujos
    // siguen siendo válidos y se dejan como están.
    if (!mantenerVista) {
      drawings = [];
      setActiveTool("cursor");
    }

    overlaySeries.forEach(s => chart.removeSeries(s));
    overlaySeries = [];

    if (!data.candles || data.candles.length === 0) {
      console.error("El servidor respondió sin velas para mostrar:", data);
      candleSerie.setData([]);
      setEstado("❌ Sin velas (F12 consola)", "error");
      return;
    }

    // El eje de precio (derecha) por defecto de la librería redondea a
    // 2 decimales — perfecto para acciones/índices, pero para forex
    // (ej. NZDUSD ~0.56770) deja el precio ilegible, todo amontonado
    // en "0.57". MT5 ya sabe la cantidad exacta de decimales que usa
    // CADA símbolo según su bróker (data.digits, calculado en
    // fetch_mt5_candles) — se la pasamos a la serie para que el precio
    // se vea completo, igual que en MT5. Si por algún motivo puntual
    // el bróker no informó "digits" (raro, pero por las dudas), se
    // infiere a partir del precio mismo en vez de quedarse con el
    // default de 2 decimales.
    const precision = data.digits != null ? data.digits : inferirPrecisionPorPrecio(data.candles);
    const minMove = 1 / Math.pow(10, precision);
    candleSerie.applyOptions({ priceFormat: { type: "price", precision, minMove } });
    console.log(`[grafico] precio — digits de MT5: ${data.digits} · precisión aplicada: ${precision} decimales`);

    candleSerie.setData(data.candles);

    currentChannels = data.channels || [];
    actualizarTogglesDisponibles();
    lastRealTime = data.candles.length ? data.candles[data.candles.length - 1].time : null;
    loadedCandles = data.candles.slice();
    btnCargarMas.style.display = "inline-block";
    btnCargarMas.disabled = false;
    btnCargarMas.textContent = "← Cargar más historial";

    dibujarCanales();

    currentKalman = data.kalman || null;
    currentPivots = data.pivots || [];
    currentKN = calcularKN(data.candles);
    currentSR = calcularSR(data.candles);
    currentSRF = calcularSRFractal(data.candles);
    currentSEQ = calcularSecuencia(data.candles);
    dibujarKalmanYMarkers();
    dibujarKN();
    dibujarSR();
    actualizarChipSRF();
    actualizarChipSEQ();
    // Símbolo/temporalidad nuevos: el historial que acaba de llegar no se
    // alerta (ya ocurrió). Solo se avisa de lo que pase a partir de acá.
    revisarAlertasSEQ(true);

    if (centrar) {
      // Carga nueva: última vela analizada en el centro.
      centrarEnUltimaVela(data.candles.length, vista);
    } else if (vista) {
      // Mismo gráfico de antes (replay / vela nueva / solo cambió la fecha):
      // se restaura el mismo encuadre relativo a la última vela.
      restaurarVista(vista, data.candles.length);
    } else {
      // Gráfico realmente nuevo (cambió divisa o timeframe): recién ahí
      // tiene sentido encuadrar todo el historial desde cero.
      chart.timeScale().fitContent();
    }
    requestAnimationFrame(() => requestAnimationFrame(redrawOverlay));

    renderizarSMF(data.smf, mantenerVista);
    currentPosicionCanales = data.posicion_canales || [];
    renderizarPosicionBoard();
    renderizarSenales(data.signals, data.channels);
  }

  // ── Tablero de posición: pinta la tabla fija de 4 filas (largo, largo
  // inverso, corto, corto inverso) con dónde está el precio respecto a
  // cada canal AHORA MISMO. El veredicto ya viene calculado en cada
  // respuesta de /datos, así que tildar/destildar el checkbox solo
  // muestra u oculta el panel, sin pedirle nada más al servidor. ──
  function renderizarPosicionBoard() {
    if (!mostrarPosicionBoard) {
      posicionBoardEl.classList.remove("show");
      return;
    }
    posicionBoardEl.classList.add("show");

    if (!currentPosicionCanales.length) {
      posicionBoardEl.innerHTML = `<div class="pb-title">TABLERO S-P-N</div><div class="pb-empty">Sin canales activos.</div>`;
      return;
    }

    const filas = currentPosicionCanales.map(r => `
      <div class="pb-row">
        <div class="pb-row-head">
          <span class="pb-label">${r.label}</span>
          <span class="pb-dir" style="background:${hexToRgba(r.estado_color, 0.18)}; color:${r.estado_color};">
            ${r.estado_label}
          </span>
        </div>
        <div class="pb-sub">
          <span class="pb-metric">Distancia: <b>${r.distancia_pct}%</b></span>
          <span class="pb-metric">Rotura:
            <span class="pb-vigencia" style="background:${hexToRgba(r.rotura_color, 0.18)}; color:${r.rotura_color};">${r.rotura_label}${r.lado_rotura ? " (" + r.lado_rotura + ")" : ""}</span>
          </span>
        </div>
      </div>`).join("");

    posicionBoardEl.innerHTML = `<div class="pb-title">TABLERO S-P-N</div>${filas}`;
  }

  // ── Persistencia de dibujos (por usuario + divisa + temporalidad) ──
  // El proyecto original no guardaba los dibujos en ningún lado (se
  // perdían al recargar la página); acá sí quedan guardados del lado del
  // servidor, asociados a este usuario — es una mejora sobre el original,
  // no algo que había que igualar.
  async function cargarDibujosServidor(symbol, timeframe) {
    try {
      const url = `${API.dibujos_listar}?symbol=${encodeURIComponent(symbol)}&timeframe=${encodeURIComponent(timeframe)}`;
      const r = await fetch(url);
      const data = await r.json();
      drawings = (data.dibujos || []).map(d => d.datos);
      redrawOverlay();
    } catch (e) {
      // Si falla la carga de dibujos no es bloqueante — el gráfico sigue
      // andando, simplemente arranca sin las anotaciones guardadas.
    }
  }

  async function guardarDibujosServidor() {
    if (!symbolActual || !timeframeActual) return;
    try {
      await fetch(API.dibujos_guardar, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF_TOKEN },
        body: JSON.stringify({
          symbol: symbolActual, timeframe: timeframeActual,
          dibujos: drawings.map(d => ({ tipo: d.type, datos: d })),
        }),
      });
    } catch (e) {
      // Guardado en segundo plano — si falla, no interrumpe el dibujo en curso.
    }
  }

  async function cargarDatos(opciones = {}) {
    if (cargandoDatos) return;
    // OJO: los listeners de click/keydown le pasan el evento como 1er argumento,
    // por eso solo se lee `centrar` si viene como booleano.
    const pedidoCentrar = opciones && opciones.centrar === true;

    const symbol    = symbolInput.value.trim().toUpperCase();
    const timeframe = timeframeSelect.value;
    const hasta     = document.getElementById("fecha-global").value;   // FECHA COMPARTIDA

    if (!symbol) {
      setEstado("❌ Ingresa una divisa", "error");
      return;
    }

    // Si es la misma divisa+timeframe que ya estaba cargada (típico del
    // reproductor de replay avanzando paso a paso, o de solo cambiar la
    // fecha), se guarda el zoom/paneo actual para restaurarlo después de
    // traer las velas nuevas — así el gráfico no "salta" a fitContent()
    // cada vez y el usuario no tiene que reacomodarlo a cada rato.
    const mantenerVista = symbol === symbolActual && timeframe === timeframeActual;
    // Se centra si la carga lo pide, o si es un gráfico nuevo (otra divisa/timeframe).
    const centrar = pedidoCentrar || !mantenerVista;

    cargandoDatos = true;
    spinner.style.display = "block";
    setEstado("Conectando a MT5…", "cargando");
    mostrarVeloCarga(symbol, timeframe, hasta);
    btnCargar.disabled = true;

    const params = new URLSearchParams({ symbol, timeframe });
    if (hasta) params.set("hasta", hasta);
    // Checkbox "Pivot auto": manda explícito true/false, así el checkbox
    // manda por sobre lo que diga config.py (elección clara desde el HTML).
    params.set("auto_pivot", chkAutoPivot.checked ? "true" : "false");

    try {
      console.log("[grafico] pidiendo /datos con:", params.toString());
      const res = await fetch(`${API.datos}?${params.toString()}`, {
        signal: AbortSignal.timeout(120000)
      });
      const data = await res.json();

      if (!res.ok) {
        console.error("[grafico] el servidor respondió con error:", res.status, data);
        setEstado(`❌ ${data.error}`, "error");
        return;
      }

      console.log("[grafico] velas recibidas:", data.symbol, data.timeframe,
        data.first_date, "→", data.last_date, `(${data.n_candles_total} velas, hasta pedido: ${hasta || "(vacío = en vivo)"})`);

      // La vista se captura ANTES de vaciar/llenar las velas posteriores: al
      // quitar o poner esas velas, la escala de tiempo corre el encuadre y,
      // si se leyera después, el gráfico quedaría desplazado.
      const vistaPrevia = mantenerVista ? capturarVista() : null;

      // ¿Esta carga viene de clic + Enter? Solo entonces se muestra lo posterior.
      // Cualquier otro "Hasta" (replay, otra fecha) invalida el pedido.
      const pideFuturo = modoGrafico === "backtesting" && verFuturoCrudo && futuroCrudo !== null
        && futuroCrudo.hasta === hasta && data.candles && data.candles.length > 0;
      if (!pideFuturo) {
        if (futuroCrudo !== null && futuroCrudo.hasta !== hasta) futuroCrudo = null;
        limiteDerecha = null;
        cantidadFuturo = 0;
        futuroSerie.setData([]);
      } else {
        // Antes de dibujar: así los indicadores no proyectan nada sobre lo que viene.
        limiteDerecha = data.candles[data.candles.length - 1].time;
      }

      renderizarTodo(data, { mantenerVista, centrar, vistaPrevia });
      symbolActual = symbol;
      timeframeActual = timeframe;
      let nota = "";
      if (pideFuturo) {
        try {
          await cargarFuturo(symbol, timeframe);
          nota = cantidadFuturo > 0
            ? ` · +${cantidadFuturo} velas posteriores, sin indicadores`
            : " · no hay velas posteriores (es la última)";
        } catch (e) {
          nota = " · no se pudieron traer las velas posteriores";
          console.error("[grafico] velas posteriores:", e);
        }
      }
      setEstado("✓ Cargado" + nota, "ok");
      await cargarDibujosServidor(symbol, timeframe);

    } catch (e) {
      if (e.name === "TimeoutError") {
        setEstado("❌ Tiempo de espera agotado", "error");
      } else {
        setEstado("❌ No se pudo conectar al servidor", "error");
      }
    } finally {
      ocultarVeloCarga();
      spinner.style.display = "none";
      btnCargar.disabled = false;
      cargandoDatos = false;
    }
  }

  // Trae las velas posteriores al corte y las dibuja CRUDAS en `futuroSerie`.
  // Nada de esto entra en loadedCandles ni en ningún cálculo: los indicadores
  // solo ven hasta el corte, igual que antes.
  async function cargarFuturo(symbol, timeframe) {
    const ultima = loadedCandles[loadedCandles.length - 1];
    const params = new URLSearchParams({
      symbol, timeframe, desde: ultima.time, cantidad: FUTURO_CRUDO_VELAS,
    });
    const res = await fetch(`${API.velas_despues}?${params.toString()}`, {
      signal: AbortSignal.timeout(60000),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || res.status);
    const velas = d.candles || [];
    // Agregar velas al final desplaza la escala de tiempo: se guarda el
    // encuadre actual (centrado, o el que el usuario haya movido mientras
    // llegaban) y se vuelve a aplicar tal cual, para que no haya salto.
    const encuadre = chart.timeScale().getVisibleLogicalRange();
    futuroSerie.setData(velas);
    cantidadFuturo = velas.length;
    if (velas.length && encuadre) {
      chart.timeScale().setVisibleLogicalRange(encuadre);
    }
    requestAnimationFrame(redrawOverlay);
  }

  // ── Aviso "Cargando…" sobre el gráfico ──
  // Aparece solo si la carga tarda más de 200 ms (una carga rápida no parpadea)
  // y nunca con el reproductor corriendo (cargaría una vez por vela y titilaría).
  // Es un div con pointer-events:none: no estorba al ratón ni a la captura rápida.
  const veloCarga = document.createElement("div");
  veloCarga.className = "carga-velo";
  veloCarga.innerHTML = '<div class="carga-caja"><span class="carga-rueda"></span><div><span class="carga-texto"></span><small>Trayendo velas y recalculando indicadores</small></div></div>';
  chartPlot.appendChild(veloCarga);
  let veloTimer = null;
  function mostrarVeloCarga(symbol, timeframe, hasta) {
    clearTimeout(veloTimer);
    if (typeof reproduciendo !== "undefined" && reproduciendo) return;
    veloTimer = setTimeout(() => {
      veloCarga.querySelector(".carga-texto").textContent =
        `Cargando ${symbol} ${timeframe}` + (hasta ? ` · hasta ${hasta.replace("T", " ")}` : "") + "…";
      veloCarga.classList.add("show");
    }, 200);
  }
  function ocultarVeloCarga() {
    clearTimeout(veloTimer);
    veloCarga.classList.remove("show");
  }

  async function cargarMasHistorial() {
    if (cargandoMas || !loadedCandles.length || !symbolActual) return;

    cargandoMas = true;
    btnCargarMas.disabled = true;
    btnCargarMas.textContent = "Cargando…";

    const rangoVisible = chart.timeScale().getVisibleRange();
    const antesDe = loadedCandles[0].time;

    const params = new URLSearchParams({
      symbol: symbolActual, timeframe: timeframeActual,
      antes_de: antesDe, cantidad: 500,
    });

    try {
      const res = await fetch(`${API.velas_extra}?${params.toString()}`, {
        signal: AbortSignal.timeout(60000),
      });
      const data = await res.json();

      if (!res.ok) {
        setEstado(`❌ ${data.error}`, "error");
        return;
      }
      if (!data.candles || data.candles.length === 0) {
        btnCargarMas.textContent = "No hay más historial";
        btnCargarMas.disabled = true;
        return;
      }

      loadedCandles = [...data.candles, ...loadedCandles];
      candleSerie.setData(loadedCandles);
      currentSRF = calcularSRFractal(loadedCandles);
      currentSEQ = calcularSecuencia(loadedCandles);
      dibujarKalmanYMarkers();
      actualizarChipSRF();
      actualizarChipSEQ();
      // Historial hacia atrás: los índices se corren, así que los ids de
      // evento cambian. Se re-sincroniza sin alertar de golpe todo lo viejo.
      revisarAlertasSEQ(true);

      if (rangoVisible) chart.timeScale().setVisibleRange(rangoVisible);
      requestAnimationFrame(() => requestAnimationFrame(redrawOverlay));

      btnCargarMas.textContent = "← Cargar más historial";
      setEstado(`✓ +${data.candles.length} velas`, "ok");

    } catch (e) {
      setEstado("❌ No se pudo traer más historial", "error");
    } finally {
      cargandoMas = false;
      btnCargarMas.disabled = false;
    }
  }

  let timeframeFijadoManual = false;   // true si vino del atajo (setTimeframe) o de una elección explícita

  async function precargarDefaults() {
    try {
      const r = await fetch(API.config, { signal: AbortSignal.timeout(3000) });
      const cfg = await r.json();
      if (!symbolInput.value) symbolInput.value = (cfg.symbol || "EURUSD").toUpperCase();
      // Si el timeframe ya se fijó explícitamente (ej. atajo desde el
      // tablero multi-temporalidad), NO lo pisa con el default de
      // config.py — antes esto pasaba siempre, sin chequear, y el
      // dropdown terminaba mostrando el timeframe de config.py aunque ya
      // se hubiera cargado el gráfico con otro distinto.
      if (!timeframeFijadoManual && cfg.timeframe &&
          [...timeframeSelect.options].some(o => o.value === cfg.timeframe.toUpperCase())) {
        timeframeSelect.value = cfg.timeframe.toUpperCase();
      }
    } catch {
      symbolInput.value = "EURUSD";
    }
  }

  // ── Inicialización del chart de este panel ──
  function init() {
    chart = LightweightCharts.createChart(chartPlot, {
      width:  chartPlot.clientWidth,
      height: chartPlot.clientHeight,
      layout:  { background:{ type: "solid", color: "#131722" }, textColor:"#d1d4dc" },
      grid:    { vertLines:{color:"#1e222d"}, horzLines:{color:"#1e222d"} },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor:"#2a2e39" },
      timeScale: { borderColor:"#2a2e39", timeVisible:true, secondsVisible:false, rightOffset: 45, shiftVisibleRangeOnNewBar: false },
    });

    candleSerie = chart.addCandlestickSeries({
      upColor:"#26a69a", downColor:"#ef5350",
      borderVisible:false,
      wickUpColor:"#26a69a", wickDownColor:"#ef5350",
      priceLineColor: "#ffcc00",
      priceLineWidth: 1,
      priceLineStyle: 1,
    });

    // Serie aparte para las velas POSTERIORES al corte (Backtesting). Colores
    // apagados para distinguirlas del tramo analizado. Ningún indicador la lee.
    futuroSerie = chart.addCandlestickSeries({
      upColor:"#4d8f88", downColor:"#b8545a",
      borderVisible:false,
      wickUpColor:"#4d8f88", wickDownColor:"#b8545a",
      priceLineVisible:false, lastValueVisible:false,
    });

    overlayCtx = overlayCanvas.getContext("2d");

    chart.timeScale().subscribeVisibleTimeRangeChange(redrawOverlay);
    chart.timeScale().subscribeVisibleLogicalRangeChange(redrawOverlay);

    // El canvas de dibujo queda con pointer-events:none en modo cursor, así
    // que es el propio chart el que recibe el mouse siempre — este listener
    // nativo (100% confiable, sin depender de que un cambio de CSS llegue a
    // tiempo para el próximo hit-test) es lo que nos dice en todo momento
    // qué dibujo está bajo el cursor. El mousedown que agarra ese dibujo
    // para arrastrarlo se resuelve más abajo, en fase de captura.
    chart.subscribeCrosshairMove(param => {
      if (activeTool !== "cursor" || dragState) return;

      if (!param.point) {
        if (hoverMatch) { hoverMatch = null; redrawOverlay(); }
        chartPlot.style.cursor = "";
        return;
      }

      const match = hitTest(param.point.x, param.point.y);
      const cambio = (match ? match.drawing : null) !== (hoverMatch ? hoverMatch.drawing : null);
      hoverMatch = match;
      chartPlot.style.cursor = match ? cursorForMatch(match) : "";
      if (cambio) redrawOverlay();
    });

    // Capturamos el mousedown ANTES de que le llegue al gráfico nativo
    // (fase de captura, sobre chartPlot) — si hay un dibujo bajo el mouse
    // en modo cursor, le cortamos el paso al gráfico (si no, además de
    // arrastrar el dibujo se movería/paneraría el gráfico por debajo) y
    // arrancamos nuestro propio arrastre.
    chartPlot.addEventListener("mousedown", e => {
      if (activeTool !== "cursor" || !hoverMatch || dragState) return;
      e.preventDefault();
      e.stopPropagation();
      const { x, y } = toCanvasXY(e);
      startDrag(hoverMatch, x, y);
      beginWindowCapture();
    }, true);

    // Doble clic sobre una anotación de texto: editar su contenido (o
    // borrarla si se deja vacía). También en fase de captura, para que no
    // dispare el doble-clic nativo del gráfico (que resetea el zoom).
    chartPlot.addEventListener("dblclick", e => {
      if (activeTool !== "cursor" || !hoverMatch || hoverMatch.drawing.type !== "text") return;
      e.preventDefault();
      e.stopPropagation();
      const d = hoverMatch.drawing;
      const txt = window.prompt("Editar texto:", d.text);
      if (txt === null) return; // canceló
      if (txt.trim() === "") {
        const idx = drawings.indexOf(d);
        if (idx !== -1) drawings.splice(idx, 1);
        hoverMatch = null;
        chartPlot.style.cursor = "";
      } else {
        d.text = txt;
      }
      redrawOverlay();
      guardarDibujosServidor();
    }, true);

    // Captura rápida (solo Backtesting): clic en una vela + Enter = ir a esa
    // fecha. Todo vive en activarCapturaRapida(); acá solo se le entregan
    // lecturas del estado de este panel, no se toca nada de lo existente.
    activarCapturaRapida({
      chart, candleSerie, chartPlot,
      getCandles: () => loadedCandles,
      getSymbol: () => symbolActual,
      getTf: () => timeframeActual,
      getActiveTool: () => activeTool,
      hayDibujoBajoCursor: () => !!hoverMatch,
      estaCargando: () => cargandoDatos,
    });

    // Cualquier cambio de tamaño del contenedor (ventana, split screen,
    // que aparezca un botón, lo que sea) re-sincroniza el chart.
    new ResizeObserver(() => {
      chart.applyOptions({ width: chartPlot.clientWidth, height: chartPlot.clientHeight });
      resizeOverlayCanvas();
      redrawOverlay();
      if (smfChart) {
        smfChart.applyOptions({ width: smfContainer.clientWidth, height: smfContainer.clientHeight });
      }
    }).observe(chartContainer);

    // ── Barra de dibujo: seleccionar herramienta ──
    drawToolButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const tool = btn.dataset.tool;
        setActiveTool(activeTool === tool ? "cursor" : tool);
      });
    });
    btnClearDrawings.addEventListener("click", () => {
      drawings = [];
      redrawOverlay();
      guardarDibujosServidor();
    });
    updateToolbarUI();
    updateCanvasInteractivity();

    // Escape cancela un dibujo/arrastre a medio hacer y vuelve al cursor.
    // Delete/Backspace borra el dibujo que está bajo el mouse (solo en modo
    // cursor, y nunca mientras se esté escribiendo en un input del panel).
    document.addEventListener("keydown", e => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

      if (e.key === "Escape" && (drawTemp || dragState || activeTool !== "cursor")) {
        dragState = null;
        setActiveTool("cursor");
